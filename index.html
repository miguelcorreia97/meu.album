const CASA_URL=()=>PROF_URL(CASA_ID);
async function sqFetch(){if(!(db&&db.cloud))return null;try{const r=await fetch(CASA_URL(),{cache:'no-store'});if(r.status===404)return {d:sqBlank(),ut:null};if(!r.ok)return null;const j=await r.json();return {d:JSON.parse(j.fields.d.stringValue),ut:j.updateTime}}catch(e){return null}}
/* junta as mudanças dos dois: compras somam-se, o que foi mudado ganha, o resto fica como está */
function sqMerge(base,loc,rem){const S=x=>JSON.stringify(x),o=JSON.parse(S(rem||sqBlank()));base=base||sqBlank();loc=loc||sqBlank();
  const ev=(x,k)=>x&&x.eq&&k in x.eq?x.eq[k]:(RDEF[k]||null);
  o.own={...(o.own||{}),...(loc.own||{})};o.buy=[...new Set([...(o.buy||[]),...(loc.buy||[])])];if(loc.pst||o.pst)o.pst=[...new Set([...(o.pst||[]),...(loc.pst||[])])];
  o.spent=(+o.spent||0)+((+loc.spent||0)-(+base.spent||0));o.custo=Math.max(+o.custo||0,+loc.custo||0);if(loc.paid!=null&&(o.paid==null||loc.paid>o.paid))o.paid=loc.paid;if(S(loc.blog)!==S(base.blog)&&(loc.paid||0)>=(o.paid||0))o.blog=loc.blog;o.mus=(+o.mus||0)+((+loc.mus||0)-(+base.mus||0));if(loc.leg||o.leg){const a=o.leg||{},b=loc.leg||{};o.leg={...a};for(const k in b)o.leg[k]=Math.max(+a[k]||0,+b[k]||0)}
  o.eq={...(o.eq||{})};for(const k of new Set([...Object.keys(loc.eq||{}),...Object.keys(base.eq||{})]))if(S(ev(loc,k))!==S(ev(base,k)))o.eq[k]=ev(loc,k);
  for(const k of ['sh','wl','px','play','on','cl','pos','mul','li'])if(S(loc[k])!==S(base[k]))o[k]=loc[k];return o}
async function sqSync(){if(!(db&&db.cloud))return;if(SQ.busy){SQ.again=1;return}SQ.busy=true;SQ.again=0;
  const snap=JSON.parse(JSON.stringify(SQ.d)),base=SQ.base;
  for(let k=0;k<8;k++){const cur=await sqFetch();if(!cur)break;const m=sqMerge(base,snap,cur.d);
    try{const r=await fetch(CASA_URL()+(cur.ut?'&currentDocument.updateTime='+encodeURIComponent(cur.ut):'&currentDocument.exists=false'),{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({fields:{d:{stringValue:JSON.stringify(m)},at:{stringValue:new Date().toISOString()}}})});
      if(r.ok){let j={};try{j=await r.json()}catch(e){}SQ.chg=JSON.stringify(m)!==JSON.stringify(snap);SQ.ut=j.updateTime||SQ.ut;SQ.base=JSON.parse(JSON.stringify(m));SQ.d=sqMerge(snap,SQ.d,m);sqSaveLocal();break}}catch(e){}
    await new Promise(z=>setTimeout(z,250+Math.random()*500))}
  SQ.busy=false;if(SQ.again)sqSync();else if(SQ.chg){SQ.chg=0;roomRefresh()}}
async function sqPull(){if(SQ.busy||!(db&&db.cloud))return;const cur=await sqFetch();if(!cur||SQ.busy||(cur.ut&&cur.ut===SQ.ut))return;if(!cur.ut&&!SQ.ut)return;
  const mine=JSON.stringify(SQ.d)!==JSON.stringify(SQ.base);SQ.d=mine?sqMerge(SQ.base,SQ.d,cur.d):JSON.parse(JSON.stringify(cur.d));SQ.base=JSON.parse(JSON.stringify(cur.d));SQ.ut=cur.ut;sqSaveLocal();if(mine)sqSync();roomRefresh()}
function roomQ(){const d=SQ.d;d.eq=d.eq||{};d.own=d.own||{};d.buy=d.buy||[];d.spent=+d.spent||0;d.mus=+d.mus||0;return {...d,eq:{...RDEF,...d.eq}}}

/* missões: só pagam quando ficam completas. O que já tinha sido pago aos quartos antes desta regra fica guardado em q.leg (não se perde nem se paga duas vezes) */
const qPart=(m,v)=>Math.round(mReward(m).r*Math.floor(4*Math.min(v,m.t)/m.t)/4);
function mPaid(m,v,key,leg){if(v>=m.t)return mReward(m).r;if(!leg)return qPart(m,v);return +leg[key]||0}
function roomEarned(){const q=roomQ(),leg=SQ.d&&SQ.d.leg;let n=(q.mus||0)+CASAL.reduce((a,w)=>a+(+profGet(w).st.vbpm||0),0);for(const m of MISSOES){if(m.co){n+=mPaid(m,coVal(m),m.id,leg);continue}for(const w of CASAL)n+=mPaid(m,stVal(profGet(w),m.s),m.id+'|'+w,leg)}return n}
async function legMigrate(){try{if(!(db&&db.cloud)||!CASAL.includes(myPid()))return;await Promise.all(CASAL.map(w=>profLoad(w)));await sqPull();if(!SQ.d||SQ.d.leg)return;
  const leg={_:1};for(const m of MISSOES){if(m.co){const v=coVal(m);if(v<m.t&&qPart(m,v))leg[m.id]=qPart(m,v);continue}for(const w of CASAL){const v=stVal(profGet(w),m.s);if(v<m.t&&qPart(m,v))leg[m.id+'|'+w]=qPart(m,v)}}
  const q=roomQ();q.leg=leg;roomSave(q)}catch(e){}}
const roomCoins=()=>roomEarned()-roomQ().spent-(+roomQ().custo||0);
function discOwned(){const q=roomQ(),s=new Set;for(const m of MISSOES){const d=DISC_MISS[m.id];if(d&&CASAL.some(w=>profGet(w).u[m.id]))s.add(d)}q.buy.forEach(k=>s.add(k));return [...s].filter(DISCO)}

  const wl=(q.wl||own.filter(k=>!sh.includes(k))).filter(k=>own.includes(k)&&!sh.includes(k)).slice(0,capW);
  const pst=q.pst||(q.px||[]),px=(q.px||pst).filter(k=>pst.includes(k)).slice(0,capP);
  const play=own.includes(q.play)?q.play:(own[0]||null);return {own,sh,wl,px,play,capS,capW,capP,box:own.filter(k=>!sh.includes(k)&&!wl.includes(k))}}
/* hora de Portugal, nascer e pôr do sol em Lisboa */
function lisNow(){const d=new Date();let p={};try{new Intl.DateTimeFormat('en-GB',{timeZone:'Europe/Lisbon',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hourCycle:'h23'}).formatToParts(d).forEach(x=>p[x.type]=+x.value)}catch(e){p={year:d.getFullYear(),month:d.getMonth()+1,day:d.getDate(),hour:d.getHours(),minute:d.getMinutes()}}
  const h=p.hour%24,mi=p.minute,min=h*60+mi,off=((min-(d.getUTCHours()*60+d.getUTCMinutes()))%1440+1440+720)%1440-720;
  const N=Math.round((Date.UTC(p.year,p.month-1,p.day)-Date.UTC(p.year,0,0))/864e5),dec=23.44*Math.sin(2*Math.PI*(N-81)/365)*Math.PI/180,lat=38.72*Math.PI/180;
  const H=Math.acos(Math.max(-1,Math.min(1,(Math.sin(-.833*Math.PI/180)-Math.sin(lat)*Math.sin(dec))/(Math.cos(lat)*Math.cos(dec)))))*180/Math.PI;
  const B=2*Math.PI*(N-81)/364,eot=9.87*Math.sin(2*B)-7.53*Math.cos(B)-1.5*Math.sin(B),noon=720+9.14*4-eot+off;
  const f=m=>{m=((Math.round(m)%1440)+1440)%1440;return String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0')};
  return {h,m:mi,min,rise:noon-H*4,set:noon+H*4,hh:f(min),f,ymd:`${p.year}-${p.month}-${p.day}`}}
function todNow(n){n=n||lisNow();if(n.min<n.rise-40||n.min>n.set+40)return 'noite';if(n.min<=n.rise+70)return 'manha';if(n.min>=n.set-70)return 'tarde';return 'dia'}
function sunPos(n){const hz=WY+100;if(todNow(n)!=='noite'||n.min>=n.rise-40&&n.min<=n.set+40){const t=(n.min-n.rise)/(n.set-n.rise),c=Math.max(0,Math.min(1,t));return [WX+18+c*(WW-36),hz-Math.sin(Math.PI*c)*86+(t<0?(-t)*60:t>1?(t-1)*60:0)]}
  const len=1440-(n.set-n.rise),tt=((n.min-n.set)%1440+1440)%1440/len,c=Math.max(0,Math.min(1,tt));return [WX+18+c*(WW-36),hz-Math.sin(Math.PI*c)*80]}

  const cap={};for(const a in by)cap[a]=by[a].length>=3?Math.floor(by[a].length*.4):0;
  const used=new Set,arts=Object.keys(by).filter(a=>cap[a]>0);let rr=0;
  const take=a=>{const k=by[a].find(x=>!used.has(x)&&x!==DISC_ARTISTA['__']);if(!k)return null;used.add(k);cap[a]--;return k};
  const next=()=>{for(let t=0;t<arts.length;t++){const a=arts[(rr++)%arts.length];if(cap[a]>0){const k=by[a].slice(1).find(x=>!used.has(x));if(k){used.add(k);cap[a]--;return k}}}return null};

function abSync(A,B){const out=[];if(A.length<AB_N||B.length<AB_N)return out;const ga=new Set(A.map(t=>ev(t.i).gen)),gb=new Set(B.map(t=>ev(t.i).gen));

  for(let ring=0;ring<2;ring++)for(let k=0;k<18;k++){const a=(k+ring*.5)/18*Math.PI*2,e=two.makeEllipse(Math.cos(a)*R*1.05,Math.sin(a)*R*1.05,R*.62,R*.2);e.rotation=a;e.noStroke();e.fill=ring?'#ffc42e':'#f7a51d';fl.add(e)}
  const core=two.makeCircle(0,0,R*.62);core.noStroke();core.fill=two.makeRadialGradient(0,0,R*.62,new Two.Stop(0,'#5a2e0e'),new Two.Stop(1,'#3a1a06'));fl.add(core);

  fl.translation.set(cx,cy);
  const txt=document.createElement('div');txt.className='it';txt.innerHTML=`<b>${esc(t)}</b><small>${esc(sub)}</small>`;box.appendChild(txt);
  const big=Math.hypot(two.width,two.height)/(R*1.2);const t0=performance.now();const D=1.9;
  two.bind('update',()=>{const el=(performance.now()-t0)/1000;const k=Math.min(1,el/D);

}

let cpuTimer=null;
const comboTotal=tr=>combos(tr).reduce((a,x)=>a+x.p,0);
function perms(a){if(a.length<=1)return [a];const r=[];a.forEach((x,i)=>perms([...a.slice(0,i),...a.slice(i+1)]).forEach(q=>r.push([x,...q])));return r}
function bestOrder(tr,effort){
  const n=tr.length,idx=tr.map((_,k)=>k);if(n<=1)return idx;
  const val=o=>comboTotal(o.map(k=>tr[k]));
  if(effort==='low')return idx.sort(()=>Math.random()-.5);
  if(n<=6&&effort!=='mid'){let best=idx,bv=-1e9;for(const o of perms(idx)){const v=val(o);if(v>bv){bv=v;best=o}}return best}
  let best=idx.slice(),bv=val(best);const restarts=effort==='mid'?1:4;
  for(let r=0;r<restarts;r++){let cur=r?idx.slice().sort(()=>Math.random()-.5):idx.slice(),cv=val(cur),imp=true;
    while(imp){imp=false;for(let i=0;i<n;i++)for(let j=i+1;j<n;j++){const c=cur.slice();[c[i],c[j]]=[c[j],c[i]];const v=val(c);if(v>cv+1e-9){cur=c;cv=v;imp=true}}}
    if(cv>bv){bv=cv;best=cur}}
  return best;
}
function cpuPick(C,opts){
  const lvl=G.level||'normal',noise={facil:3,normal:1.2,dificil:.25}[lvl],eff={facil:'low',normal:'mid',dificil:'high'}[lvl];
  const mine=rawTracks(C);
  const sc=opts.map(o=>{const tr=[...mine,o];const ord=bestOrder(tr,eff==='low'?'mid':eff);return comboTotal(ord.map(k=>tr[k]))+ev(o.i).nota*.8+Math.random()*noise});
  return sc[0]>=sc[1]?opts[0]:opts[1];
}

      picks:[],orders:{},names:{...(G?.names||{}),[P(1-WHO)]:CPU_ALB[Math.floor(Math.random()*CPU_ALB.length)]},bonus:{}},true);return}

  L.confirmNew=false;if(MODE==='cpu'){G=null;saveLocal();L.round=null;render();return}W({...emptyRoom(CODE,G.joined),players:G.players||{},round:(G.round||0)+1,names:G.names||{}},true);

function pickPatch(p,i){const np=[...picks(),{p,i}],now=Date.now(),o={picks:np,ts:now};if(np.length>=G.per*2)o.orderTs=now;return o}
function flyToShelf(i,p){try{const src=document.querySelector(`.pair .sleeve[data-i="${i}"] .cover`);const dst=document.querySelector(`.shelfbox[data-p="${p}"] .slot`);if(!src||!dst)return;
  const a=src.getBoundingClientRect(),b=dst.getBoundingClientRect(),img=src.querySelector('img');if(!img)return;
  const f=document.createElement('div');f.className='flyer';f.innerHTML=`<img src="${img.getAttribute('src')}" alt="">`;Object.assign(f.style,{left:a.left+'px',top:a.top+'px',width:a.width+'px',height:a.height+'px'});document.body.appendChild(f);
  const dx=b.left-a.left,dy=b.top-a.top,sc=b.width/a.width;
  f.animate([{transform:'translate(0,0) scale(1) rotate(0)'},{transform:`translate(${dx*.5}px,${dy*.5-120}px) scale(${(1+sc)/2}) rotate(-12deg)`,offset:.5},{transform:`translate(${dx}px,${dy}px) scale(${sc}) rotate(0)`}],{duration:750,easing:'cubic-bezier(.3,.7,.3,1)',fill:'forwards'});
  setTimeout(()=>f.remove(),900)}catch(e){}}
function choose(i){if(turn()!==WHO||L.busy||L.choosing!=null)return;missionPick(i);try{const r=document.querySelector(`.pair .sleeve[data-i="${i}"]`).getBoundingClientRect();if(FX.ok)fxConfetti(28,r.left+r.width/2,r.top+r.height/2)}catch(e){}L.choosing=i;render();flyToShelf(i,WHO);setTimeout(()=>{L.choosing=null;if(turn()===WHO)W(pickPatch(WHO,i))},650)}
function undo(){const p=picks();if(p.length&&p[p.length-1].p===WHO)W({picks:p.slice(0,-1)})}
function mv(k,d){const o=L.order;if(k+d<0||k+d>=o.length)return;const before={};document.querySelectorAll('.orow[data-id]').forEach(el=>before[el.dataset.id]=el.getBoundingClientRect().top);
  const moved=rawTracks(WHO)[o[k]].i;[o[k],o[k+d]]=[o[k+d],o[k]];render();
  document.querySelectorAll('.orow[data-id]').forEach(el=>{const t0=before[el.dataset.id];if(t0==null)return;const dy=t0-el.getBoundingClientRect().top;if(Math.abs(dy)<1)return;
    el.animate([{transform:`translateY(${dy}px)`},{transform:'none'}],{duration:380,easing:'cubic-bezier(.2,.8,.2,1)'});
    if(+el.dataset.id===moved)el.animate([{boxShadow:'0 0 0 2px #ffc93c, 0 0 30px rgba(255,201,60,.5)'},{boxShadow:'0 0 0 0 transparent'}],{duration:900})});
  const tot=document.querySelector('.dock-tot,.otot');if(tot)tot.animate([{transform:'scale(1.25)'},{transform:'scale(1)'}],{duration:350});}
function lockOrder(){if(G&&G.orders&&G.orders[P(WHO)])return;const n=(document.getElementById('albName')?.value||L.albName||'').trim().slice(0,40);const tr=rawTracks(WHO);const ord=(L.order&&L.order.length===tr.length)?L.order.slice():tr.map((_,k)=>k);W({orders:{[P(WHO)]:ord},names:{[P(WHO)]:n},reveal:0,revealAt:Date.now()})}

async function copyRes(w){

async function saveRanking(){
  if(!db||!G||!G.seed||WHO==null)return;const key=G.seed+'-'+P(WHO);if(L.savedRank===key)return;L.savedRank=key;
  try{const tr=aligned(WHO).slice(0,G.per),sc=rankScore(WHO);

      combos:prizePts(WHO),per:G.per,tracks:tr.map(t=>t.i),pedido:pedido().n,at:new Date().toISOString()});

  if(L.screen==='regras')return rulesScreen();

  if(MODE==='cpu'){if(!G||!G.seed)return newScreen();return ({draft,order,duels})[phase()]()}
  if(L.status==='boot')return `<div class="panel wait"><div class="minirecord"></div><div class="big">A pôr o disco…</div></div>`;
  if(L.status==='nodb')return `<div class="panel wait"><div class="big">Sem ligação ao jogo</div><p>Abre esta página com sessão iniciada no Claude. A Clara precisa que o Miguel lhe partilhe a página como <b>Editor</b> (ou usem a versão web do jogo).</p></div>`;
  if(!CODE)return roomScreen();
  if(L.status==='loading')return `<div class="panel wait"><div class="minirecord"></div><div class="big">A entrar na sala ${esc(CODE)}…</div></div>`;
  if(L.status==='slow')return `<div class="panel wait"><div class="minirecord"></div><div class="big">Ainda a ligar…</div><p>A sala está a demorar a responder. Verifica a ligação — a página continua a tentar.</p></div>`;
  if(L.status==='error')return `<div class="panel wait"><div class="big">Ups</div><p>${esc(L.err)}</p><div class="mt"><button class="btn" onclick="leaveRoom();leaveRoom()">Voltar</button></div></div>`;
  if(L.status==='gone'||!G)return `<div class="panel wait"><div class="big">${db&&db.p2p?'Não consegui ligar à sala':'Esta sala já não existe'}</div>${db&&db.p2p?'<p>Quem criou a sala tem de ter o jogo aberto no telemóvel ou no computador.</p>':''}<div class="mt"><button class="btn" onclick="leaveRoom();leaveRoom()">Voltar</button></div></div>`;
  if(!(G.joined?.p0&&G.joined?.p1))return lobby();
  if(G.coop&&G.coop.seed)return coScreen();
  if(!G.seed)return newScreen();
  return ({draft,order,duels})[phase()]();
}
function viewKey(){if(L.screen)return 'scr:'+L.screen+(L.rank?'1':'0')+(L.rankPer||'all');if(MODE==='online'&&G&&G.coop&&G.coop.seed){const c=G.coop;return ['co',c.seed,c.m,(c.tp||[]).length,!!(c.ok&&c.ok.p0&&c.ok.p1),JSON.stringify(c.fav&&Object.keys(c.fav)),JSON.stringify(c.gs&&Object.keys(c.gs)),c.r,JSON.stringify(c.hist&&c.hist[c.r])].join('|')}if(!G||!G.seed||!MODE)return [WHO,MODE,CODE,L.status,G?.joined?.p0,G?.joined?.p1,G?.seed].join('|');const ph=phase();return [MODE,G.round,ph,ph==='draft'?picks().length:'',ph==='duels'?stageKind().join(':'):'',ph==='order'?!!G.orders?.[P(WHO)]:''].join('|')}
function mBackSync(){let b=document.getElementById('mtopback');if(L.screen==='missoes'){if(!b){b=document.createElement('div');b.id='mtopback';b.className='mtopback';b.innerHTML='<button class="btn ghost sm" onclick="closeMissions();scrollTo(0,0)">← Voltar</button>';document.body.appendChild(b)}}else if(b)b.remove()}
function render(){setTimeout(mBackSync,0);if(L.rFull&&L.screen!=='quarto'){L.rFull=false;document.body.classList.remove('rfull');if(document.fullscreenElement)document.exitFullscreen().catch(()=>{})}
  const app=document.getElementById('app'),keep={},kx={};app.querySelectorAll('.rtemas,.rcats,.rart,.qtabs,.dsub,.roomscroll').forEach((e,i)=>kx[e.className+'#'+i]=e.scrollLeft);app.querySelectorAll('input[id]').forEach(i=>keep[i.id]=i.value);
  const fid=document.activeElement&&document.activeElement.id;
  const key=viewKey(),enter=key!==L.lastKey,prevKey=L.lastKey||'';L.lastKey=key;
  /* troca suave dentro da mesma fase (duelo → duelo): só um fade, sem a página toda a reentrar */
  const soft=enter&&key.split('|').slice(0,3).join('|')===prevKey.split('|').slice(0,3).join('|')&&key.includes('|duels|')&&!/\|result/.test(key);
  /* prende a altura durante a troca, para a página não saltar */
  const h0=app.offsetHeight;if(enter&&h0){app.style.minHeight=h0+'px';clearTimeout(L.hT);L.hT=setTimeout(()=>{app.style.minHeight=''},soft?450:700)}
  document.body.classList.toggle('ingame',!!(G&&G.seed&&MODE));app.innerHTML=header()+`<main class="view ${enter?(soft?'enter soft':'enter'):''}">${body()}</main>`+dock()+draftDock()+reactBar();try{rxCheck();botTick();voteCheck();coVoteCheck();skipCheck();missionEnd()}catch(e){}
  document.body.classList.toggle('has-dock',!!document.querySelector('.odock'));document.body.classList.toggle('has-ddock',!!document.querySelector('.ddock'));{const sd=app.querySelector('main .stagedock');if(sd){if(L.hadSd)sd.style.animation='none';app.appendChild(sd)}L.hadSd=!!sd}document.body.classList.toggle('has-sdock',!!document.querySelector('.stagedock'));
  try{boardMount()}catch(e){}
  for(const k in keep){const el=document.getElementById(k);if(el)el.value=keep[k]}
  app.querySelectorAll('.rtemas,.rcats,.rart,.qtabs,.dsub,.roomscroll').forEach((e,i)=>{const v=kx[e.className+'#'+i];if(v)e.scrollLeft=v;else if(e.classList.contains('roomscroll')&&e.scrollWidth>e.clientWidth+4)e.scrollLeft=(e.scrollWidth-e.clientWidth)*.4});
  if(fid)document.getElementById(fid)?.focus();
  const pk=(G&&G.seed&&MODE)?(phase()==='duels'?'duels:'+(stageKind()[0]==='duel'&&stageKind()[1]<G.per?'duel':stageKind()[0]):phase()):'';
  if(pk!==L.lastPhase){const prevP=L.lastPhase;L.lastPhase=pk;if(prevP!==undefined&&pk){const T={draft:['Isto ou aquilo!','escolham as vossas músicas'],order:['Hora de ordenar','monta o teu álbum'],'duels:duel':['Duelos!','faixa contra faixa'],'duels:combos':['Combinações','como montaram os álbuns'],'duels:suspense':['E agora…','o grande final']}[pk];if(T)intertitle(T[0],T[1])}}
  sambaLetters();
  if(enter){if(!soft&&scrollY>4)window.scrollTo({top:0,behavior:scrollY>900?'auto':'smooth'});else if(soft&&scrollY>120)window.scrollTo({top:0,behavior:'smooth'});countUps();setTimeout(fitDraft,450);
    if(document.querySelector('.view .winner')){celebrate(120);saveRanking()}
    else if(document.querySelector('.view .pick.win.mine'))celebrate(24);}
}
function intertitle(t,sub){return;if(FX.ok){document.querySelectorAll('.inter').forEach(e=>e.remove());fxSunflower(t,sub);return}if(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches)return;
  document.querySelectorAll('.inter').forEach(e=>e.remove());const d=document.createElement('div');d.className='inter';
  d.innerHTML=`<div class="iflower">${sunflower()}</div><div class="it"><b>${esc(t)}</b><small>${esc(sub)}</small></div>`;
  document.body.appendChild(d);setTimeout(()=>d.remove(),2000)}
const BIGW={draft:'ISTO OU AQUILO',order:'ÁLBUM','duels:duel':'DUELO','duels:combos':'COMBOS','duels:bonus':'BÓNUS','duels:suspense':'FINAL'};
function sambaLetters(){document.querySelectorAll('.view .tot-head h2').forEach(h=>{if(h.dataset.k)return;h.dataset.k=1;const t=h.textContent;const m=t.match(/^(.*?)(\s\S+)$/);if(m)h.innerHTML=`${esc(m[1])} <em>${esc(m[2].trim())}</em>`});return;const w=L.screen==='ranking'?'TOP 10':BIGW[L.lastPhase];document.querySelectorAll('.view .tot-head').forEach(h=>{if(w&&!h.querySelector('.bigword'))h.insertAdjacentHTML('afterbegin',`<div class="bigword" aria-hidden="true">${esc(w)}</div>`)});return;document.querySelectorAll('.view .tot-head h2,.view .suspense h2').forEach(h=>{if(h.children.length)return;const t=h.textContent;h.innerHTML=[...t].map((c,k)=>`<span class="sl" style="animation-delay:${.15+k*.035}s">${c===' '?'&nbsp;':esc(c)}</span>`).join('')})}
function fitDraft(){try{const d=document.querySelector('.ddock');const btn=[...document.querySelectorAll('.pair .pick .btn')];if(!d||!btn.length)return;const lim=d.getBoundingClientRect().top-10,bot=Math.max(...btn.map(b=>b.getBoundingClientRect().bottom));if(bot>lim)window.scrollBy({top:bot-lim})}catch(e){}}
function countUps(){
  document.querySelectorAll('[data-count]').forEach(el=>{const v=parseFloat(el.dataset.count),dec=el.dataset.dec==='1',t0=performance.now(),dur=900+Math.random()*300,delay=parseFloat(el.dataset.delay||'250');
    el.textContent=dec?'0':'0';
    const step=t=>{const k=Math.min(1,Math.max(0,(t-t0-delay)/dur)),e=1-Math.pow(1-k,3),x=v*e;el.textContent=dec?fmt1(k<1?Math.round(x*10)/10:v):fmt(k<1?Math.round(x*4)/4:v);if(k<1)requestAnimationFrame(step)};
    requestAnimationFrame(step)});
}
function celebrate(n){if(FX.ok){fxConfetti(Math.min(160,n+20));return}
  if(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches)return;
  const box=document.createElement('div');box.className='confetti';document.body.appendChild(box);
  const cols=['#FFD700','#009C3B','#1338BE','#FFD700','#009C3B','#F7F7F7'];let h='';
  for(let k=0;k<n;k++){const x=Math.random()*100,dl=Math.random()*.9,du=2.6+Math.random()*2.2,sz=8+Math.random()*16,r=Math.random();
    const inner=r<.18?sunflower():r<.38?heart():`<i style="background:${cols[k%cols.length]}"></i>`;
    h+=`<span style="left:${x}%;width:${sz}px;height:${sz}px;animation-delay:${dl}s;animation-duration:${du}s;--sway:${(Math.random()*120-60).toFixed(0)}px;--rot:${(Math.random()*900-450).toFixed(0)}deg">${inner}</span>`}
  box.innerHTML=h;setTimeout(()=>box.remove(),6500);
}

/* ======== fundo: capas, girassóis e corações ======== */
function sunflower(){let p='';for(let k=0;k<16;k++)p+=`<ellipse cx="50" cy="20" rx="8" ry="20" fill="${k%2?'#ffc93c':'#f5a623'}" transform="rotate(${k*22.5} 50 50)"/>`;
  let d='';for(let k=0;k<18;k++){const a=k*2.4,r=3+k*.9;d+=`<circle cx="${50+r*Math.cos(a)}" cy="${50+r*Math.sin(a)}" r="1.6" fill="#2a160a" opacity=".7"/>`}
  return `<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">${p}<circle cx="50" cy="50" r="19" fill="#6b3a17"/><circle cx="50" cy="50" r="15" fill="#4a2810"/>${d}</svg>`}
function heart(){return `<svg viewBox="0 0 100 92" xmlns="http://www.w3.org/2000/svg"><path d="M50 88 C 18 64 2 46 2 27 C 2 12 14 2 28 2 C 38 2 46 8 50 17 C 54 8 62 2 72 2 C 86 2 98 12 98 27 C 98 46 82 64 50 88Z" fill="#ffd23f"/><path d="M22 18 q8 -6 16 0" stroke="#fff3b0" stroke-width="5" fill="none" stroke-linecap="round" opacity=".7"/></svg>`}
function buildBg(){
  const wall=document.getElementById('bgwall');if(!wall)return;
  const n=Math.max(4,Math.min(10,Math.ceil(window.innerWidth/140)));
  const r=rng(hash('fundo'+n));const idx=SONGS.map((_,i)=>i).filter(i=>!EXCL.has(i)&&SONGS[i][2]);
  let html='';
  for(let c=0;c<n;c++){
    const pick=[];for(let k=0;k<9;k++)pick.push(idx[Math.floor(r()*idx.length)]);
    const imgs=pick.map(i=>`<img src="${SONGS[i][2]}" alt="" loading="lazy">`).join('');
    html+=`<div class="col ${c%2?'down':''}" style="--dur:${70+Math.floor(r()*50)}s">${imgs}${imgs}</div>`;
  }
  wall.innerHTML=html;
  document.querySelectorAll('.tinyflower').forEach(e=>e.innerHTML=sunflower());
}
let _bgW=0;window.addEventListener('resize',()=>{const n=Math.ceil(window.innerWidth/140);if(n!==_bgW){_bgW=n;buildBg()}});

/* ======== arranque ======== */
buildBg();
{const ls=lsGet(),fresh=ls.alive&&Date.now()-ls.alive<120000;if(fresh&&ls.me&&(ls.who===0||ls.who===1)){ME=ls.me;WHO=ls.who}else{WHO=null;ME=null}}
/* abrir o site de novo começa sempre no menu principal (mantém quem és);
   só um recarregar acidental a meio do jogo (menos de 2 min) continua onde estava */
{const ls=lsGet();if(!(ls.alive&&Date.now()-ls.alive<120000))lsSet({mode:null,code:null,cpuGame:null})}
const _alive=()=>{if(!document.hidden)lsSet({alive:Date.now()})};_alive();setInterval(_alive,15000);
addEventListener('pagehide',()=>lsSet({alive:Date.now()}));document.addEventListener('visibilitychange',()=>{if(document.hidden)lsSet({alive:Date.now()})});
render();
try{fxInit()}catch(e){}
(async()=>{
  const c=window.claude;
  if(!c||!c.use){
    db=makeCloudDb();setTimeout(()=>{plLoad();if(ME){profLoad(myPid());profFlush(myPid())}},900);db.onPeer=v=>{if(L.peerOnline!==v){L.peerOnline=v;const h=document.getElementById('hdr');if(h)h.outerHTML=header()}}
    const m=lsGet().mode;if(m==='cpu'||m==='online')setMode(m);else{L.status='ok';render()}return}
  try{db=await c.use('db')}catch(e){db=null}
  if(!db){db=null}
  try{room=await c.use('room')}catch(e){room=null}
  const m=lsGet().mode;if(m==='online'||m==='cpu')setMode(m);else{L.status='ok';render()}
})();
