<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Meu Álbum">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#2a1205">
<title>Meu Álbum · Miguel × Clara</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shrikhand&family=Anton&family=Playfair+Display:ital,wght@0,800;0,900;1,700&family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,700;0,9..144,900;1,9..144,400;1,9..144,700&family=Space+Mono:wght@400;700&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --wall:#1c120b;--wall2:#2a1a10;--wood:#6e4325;--wood2:#3e2414;
  --cream:#f6e7c9;--cream2:#d9c29b;--muted:#a88c6a;
  --amber:#f2a33a;--terra:#e8433a;--mostarda:#e8b52a;--verde:#2f7d55;--teal:#1f5c5a;--rosa:#c2477a;
  --p0:#4a9dff;--p1:#ffd23f;--red:#e8433a;--green:#2fb36a;--orange:#f28c28;--yellow:#ffc93c;--r:14px;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--wall);color:var(--cream);font-family:"DM Sans",system-ui,sans-serif;font-size:16px;line-height:1.45}
body{
  background:
    radial-gradient(ellipse 70% 45% at 50% -5%,rgba(255,176,90,.38),transparent 70%),
    radial-gradient(ellipse 40% 30% at 90% 30%,rgba(217,96,59,.16),transparent 70%),
    radial-gradient(ellipse 50% 35% at 5% 85%,rgba(47,125,85,.18),transparent 70%),
    repeating-radial-gradient(circle at 30% 20%,rgba(255,255,255,.012) 0 2px,transparent 2px 5px),
    linear-gradient(var(--wall2),var(--wall));
  background-attachment:fixed;min-height:100vh;overflow-x:hidden}
.leaf{position:fixed;pointer-events:none;z-index:0;opacity:.55}
.leaf.l1{left:-60px;bottom:-40px;width:300px;transform:rotate(12deg)}
.leaf.l2{right:-70px;top:60px;width:260px;transform:scaleX(-1) rotate(-18deg);opacity:.35}
#app{position:relative;z-index:1;max-width:920px;margin:0 auto;padding:18px 16px 70px}
h1,h2,h3{margin:0;line-height:1.08}
.mono{font-family:"Space Mono",monospace;letter-spacing:.08em;text-transform:uppercase;font-size:12px}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:24px;flex-wrap:wrap}
.logo{font-family:Anton,Impact,sans-serif;font-size:24px;color:var(--amber);text-shadow:0 0 18px rgba(242,163,58,.45)}
.logo small{font-family:"Space Mono",monospace;font-size:11px;color:var(--muted);margin-left:8px;letter-spacing:.1em;text-shadow:none}
.topr{display:flex;align-items:center;gap:14px;font-size:14px;color:var(--cream2)}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#5b4632;margin-right:6px;vertical-align:middle}
.dot.on{background:#7be0a4;box-shadow:0 0 8px #7be0a4}
.linkbtn{background:none;border:0;color:var(--muted);font:inherit;font-size:13px;cursor:pointer;text-decoration:underline;padding:4px}
.linkbtn.warn{color:var(--amber);font-weight:700}
.c0{color:var(--p0)}.c1{color:var(--p1)}
/* hero */
.hero{text-align:center;padding:6px 0 26px}
.hero .vs{font-family:Anton,Impact,sans-serif;font-size:clamp(46px,10vw,86px);line-height:1;letter-spacing:.01em}
.hero .vs .x{font-family:Fraunces,serif;font-style:italic;font-weight:400;color:var(--cream2);font-size:.6em;margin:0 .2em}
.hero p{color:var(--cream2);max-width:540px;margin:14px auto 0}
.turntable{width:210px;height:210px;margin:6px auto 18px;position:relative}
.record{width:100%;height:100%;border-radius:50%;background:repeating-radial-gradient(circle,#141010 0 2px,#221a16 2px 3px);box-shadow:0 0 0 6px #0d0a08,0 20px 50px rgba(0,0,0,.6),0 0 60px rgba(242,163,58,.25);animation:spin 6s linear infinite;position:relative}
.record::after{content:"";position:absolute;inset:36%;border-radius:50%;background:radial-gradient(circle,#1c120b 0 7%,var(--mostarda) 8% 60%,var(--terra) 61%);}
.record::before{content:"";position:absolute;inset:0;border-radius:50%;background:conic-gradient(from 20deg,transparent 0 40deg,rgba(13,31,92,.12) 60deg,transparent 80deg 220deg,rgba(13,31,92,.08) 240deg,transparent 260deg);z-index:1}
@keyframes spin{to{transform:rotate(360deg)}}
/* panels */
.panel{background:linear-gradient(180deg,rgba(62,36,20,.72),rgba(36,22,13,.82));border:1px solid rgba(242,163,58,.22);border-radius:var(--r);padding:22px;box-shadow:0 20px 50px rgba(0,0,0,.35),inset 0 1px 0 rgba(13,31,92,.06);backdrop-filter:blur(2px)}
.panel+.panel{margin-top:20px}
.panel h3{font-family:Fraunces,serif;font-size:24px;font-weight:700}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid rgba(13,31,92,.35);background:transparent;border-radius:999px;padding:8px 16px;font:inherit;font-size:14px;cursor:pointer;color:var(--cream)}
.chip.on{background:var(--amber);color:#2a1a10;border-color:var(--amber);font-weight:700}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;background:linear-gradient(180deg,#f7b44f,#e08a2a);color:#2a160a;font:inherit;font-weight:700;font-size:17px;padding:14px 24px;border-radius:999px;cursor:pointer;box-shadow:0 8px 24px rgba(242,163,58,.35),inset 0 1px 0 rgba(255,255,255,.35);transition:transform .1s,filter .15s}
.btn:hover{filter:brightness(1.06)}.btn:active{transform:scale(.97)}
.btn.full{width:100%}
.btn.ghost{background:transparent;color:var(--cream);border:1px solid rgba(13,31,92,.4);box-shadow:none}
.btn:disabled{opacity:.5;cursor:wait}
label{display:block;margin:16px 0 8px}
input[type=text]{width:100%;padding:12px 14px;border:1px solid rgba(13,31,92,.3);border-radius:10px;font:inherit;background:rgba(0,0,0,.25);color:var(--cream)}
input[type=text]::placeholder{color:#8a735a}
input[type=text]:focus{outline:2px solid var(--amber);outline-offset:1px}
.err{background:rgba(217,96,59,.18);color:#ffc2a8;border:1px solid var(--terra);border-radius:10px;padding:10px 12px;margin-top:14px;font-weight:700;font-size:14px}
.hint{font-size:13px;color:var(--muted);margin-top:8px}
.center{text-align:center}.mt{margin-top:22px}
/* who */
.who{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:10px}
.whobtn{border:1px solid rgba(13,31,92,.25);background:rgba(0,0,0,.2);border-radius:var(--r);padding:28px 10px;cursor:pointer;color:var(--cream);font:inherit;transition:transform .15s,border-color .15s}
.whobtn:hover{transform:translateY(-3px);border-color:var(--amber)}
.whobtn .n{font-family:Anton,Impact,sans-serif;font-size:38px;display:block}
/* progress */
.meta{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap;color:var(--muted)}
.progress{height:6px;border-radius:999px;overflow:hidden;background:rgba(13,31,92,.12);margin:8px 0 22px}
.progress div{height:100%;background:linear-gradient(90deg,var(--terra),var(--amber),var(--mostarda));transition:width .4s}
/* this or that */
.tot-head{text-align:center;margin-bottom:20px}
.tot-head h2{font-family:Anton,Impact,sans-serif;font-size:clamp(34px,7vw,52px);font-weight:400}
.tot-head .sub{color:var(--cream2);margin-top:6px}
.pair{display:grid;grid-template-columns:1fr auto 1fr;gap:18px;align-items:center}
@media(max-width:680px){
  .pair{grid-template-columns:1fr 1fr;gap:14px;position:relative;align-items:start}
  .pair .ou{position:absolute;left:50%;top:calc((50vw - 30px)/2);transform:translate(-50%,-50%);z-index:3;font-size:22px;background:var(--wall);border-radius:50%;width:46px;height:46px;display:flex;align-items:center;justify-content:center;padding:0;box-shadow:0 0 0 1px rgba(242,163,58,.4)}
  .pair .sleeve{width:100%;margin-right:0}
  .pair .sleeve .disc{right:-5%}
  .pair .sleeve .sticker{display:none}
  .pick .tt{font-size:18px}.pick .ta{font-size:13px}
  .pick .btn{font-size:15px;padding:11px 16px;width:100%}
  .listen a{margin:0 4px}
  .reveal .ou{top:calc((50vw - 30px)/2 + 28px)}
}
.ou{font-family:Fraunces,serif;font-style:italic;font-size:34px;color:var(--amber);text-align:center;padding:0 4px;text-shadow:0 0 16px rgba(242,163,58,.5)}
.pick{display:flex;flex-direction:column;align-items:center;text-align:center}
.pick .info{margin-top:16px}
.pick .tt{font-family:Fraunces,serif;font-weight:700;font-size:24px;line-height:1.15}
.pick .ta{color:var(--cream2);font-size:15px;margin-top:2px}
.pick .btn{margin-top:14px}
.listen{font-size:12px;margin-top:6px}
.listen a{color:var(--mostarda);margin:0 7px;text-decoration:none;font-family:"Space Mono",monospace;letter-spacing:.04em}
.listen a:hover{text-decoration:underline}
/* sleeve */
.sleeve{position:relative;width:min(240px,62vw);aspect-ratio:1;margin-right:34px}
.sleeve.sm{width:100%;margin-right:0}
.sleeve .disc{position:absolute;top:4%;bottom:4%;right:-16%;aspect-ratio:1;border-radius:50%;background:repeating-radial-gradient(circle,#151010 0 1.5px,#241b16 1.5px 3px);box-shadow:0 10px 25px rgba(0,0,0,.5);transition:right .4s ease}
.sleeve .disc::after{content:"";position:absolute;inset:34%;border-radius:50%;background:radial-gradient(circle,#1c120b 0 8%,var(--lbl,#e8b52a) 9%)}
.sleeve .cover{position:absolute;inset:0;border-radius:4px;overflow:hidden;box-shadow:0 14px 30px rgba(0,0,0,.55),inset 0 0 0 1px rgba(255,255,255,.08)}
.sleeve .cover svg{display:block;width:100%;height:100%}
.sleeve .cover::after{content:"";position:absolute;inset:0;background:linear-gradient(115deg,rgba(255,255,255,.14),transparent 40%,transparent 70%,rgba(0,0,0,.18))}
.sleeve .sticker{position:absolute;left:7%;bottom:7%;right:7%;background:rgba(13,31,92,.93);color:#2a1a10;border-radius:3px;padding:6px 8px;font-family:Fraunces,serif;font-weight:900;font-size:clamp(13px,1.8vw,17px);line-height:1.1;text-align:left;box-shadow:0 2px 6px rgba(0,0,0,.25)}
.sleeve .sticker small{display:block;font-family:"Space Mono",monospace;font-weight:400;font-size:10px;letter-spacing:.06em;margin-top:2px;text-transform:uppercase;color:#6e4325}
.pick:hover .sleeve .disc{right:-26%}
.pick:hover .sleeve .disc,.sleeve.playing .disc{animation:spin 3s linear infinite}
.waiting-pick{opacity:.92}
/* shelves */
.shelves{display:grid;grid-template-columns:1fr 1fr;gap:26px;margin-top:34px}
@media(max-width:680px){.shelves{grid-template-columns:1fr}}
.shelfbox h3{font-family:Fraunces,serif;font-size:20px}
.shelfbox .by{color:var(--muted);margin:2px 0 12px}
.row{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;padding:0 4px 10px;min-height:60px}
.row .slot{aspect-ratio:1;border:1px dashed rgba(13,31,92,.16);border-radius:3px}
.mini{position:relative;aspect-ratio:1;border-radius:3px;overflow:hidden;box-shadow:0 6px 12px rgba(0,0,0,.5);cursor:default}
.mini svg{width:100%;height:100%;display:block}
.mini .lab{position:absolute;inset:auto 0 0 0;background:rgba(28,18,11,.82);color:var(--cream);font-size:9px;line-height:1.15;padding:3px 4px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.plank{height:12px;border-radius:2px;background:linear-gradient(180deg,#8a5631,var(--wood) 40%,var(--wood2));box-shadow:0 16px 36px rgba(255,170,80,.28),0 3px 6px rgba(0,0,0,.6)}
.shelfbox .list{margin:14px 0 0;padding:0;list-style:none;font-size:14px;counter-reset:t}
.shelfbox .list li{counter-increment:t;padding:5px 0;border-top:1px solid rgba(13,31,92,.08);display:flex;gap:8px}
.shelfbox .list li::before{content:counter(t,decimal-leading-zero);font-family:"Space Mono",monospace;color:var(--muted);font-size:12px;padding-top:2px}
.shelfbox .list .a{color:var(--muted)}
/* wait */
.wait{text-align:center;padding:42px 20px}
.wait .big{font-family:Anton,Impact,sans-serif;font-size:clamp(28px,6vw,42px);margin:12px 0 8px}
.wait p{color:var(--cream2);max-width:460px;margin:0 auto}
.minirecord{width:70px;height:70px;margin:0 auto;border-radius:50%;background:repeating-radial-gradient(circle,#151010 0 1.5px,#241b16 1.5px 3px);position:relative;animation:spin 2.5s linear infinite;box-shadow:0 0 30px rgba(242,163,58,.3)}
.minirecord::after{content:"";position:absolute;inset:34%;border-radius:50%;background:radial-gradient(circle,#1c120b 0 9%,var(--terra) 10%)}
/* order */
.orderrow{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid rgba(13,31,92,.08)}
.orderrow:first-child{border-top:0}
.orderrow .n{font-family:Anton,Impact,sans-serif;font-size:22px;width:30px;color:var(--amber);text-align:center}
.orderrow .thumb{width:52px;flex:none}
.orderrow .info{flex:1;min-width:0}
.orderrow .tt{font-weight:700}.orderrow .ta{color:var(--muted);font-size:14px}
.mv{width:40px;height:40px;border:1px solid rgba(13,31,92,.3);border-radius:10px;background:rgba(0,0,0,.2);font-size:18px;cursor:pointer;color:var(--cream)}
.mv:disabled{opacity:.2;cursor:default}
/* duel reveal */
.reveal .pick .owner{font-family:"Space Mono",monospace;font-size:12px;letter-spacing:.1em;text-transform:uppercase;font-weight:700;margin-bottom:10px}
.pick.win .sleeve .cover{box-shadow:0 0 0 3px var(--amber),0 0 40px rgba(242,163,58,.55)}
.pick.lose{opacity:.55}
.tally{display:flex;gap:6px;justify-content:center;margin-top:8px;min-height:22px}
.tally span{font-size:12px;border-radius:999px;padding:2px 10px;color:#1c120b;font-weight:700}
.score{display:flex;justify-content:center;align-items:center;gap:22px;margin:26px 0}
.score .s{text-align:center}.score .num{font-family:Anton,Impact,sans-serif;font-size:50px;line-height:1}
.score .lbl{font-family:"Space Mono",monospace;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--cream2)}
.score .dash{font-family:Fraunces,serif;font-style:italic;font-size:26px;color:var(--muted)}
/* result */
.winner{text-align:center;margin:20px 0 6px}
.winner h1{font-family:Anton,Impact,sans-serif;font-weight:400;font-size:clamp(36px,8vw,64px);margin-top:8px;text-shadow:0 0 30px rgba(242,163,58,.35)}
.winner .by{font-family:Fraunces,serif;font-style:italic;font-size:22px;margin-top:6px;color:var(--cream2)}
.covers{display:grid;grid-template-columns:1fr 1fr;gap:30px;margin-top:30px}
@media(max-width:600px){.covers{grid-template-columns:1fr}}
.coverwrap{position:relative;display:flex;flex-direction:column;align-items:center}
.coverwrap .sleeve{width:min(280px,70vw)}
.coverwrap.lose{opacity:.6;filter:saturate(.5)}
.coverwrap .cap{margin-top:14px;font-family:Fraunces,serif;font-size:18px;text-align:center}
.crown{position:absolute;top:-30px;left:50%;transform:translateX(-60%) rotate(-10deg);font-size:44px;z-index:3;filter:drop-shadow(0 4px 8px rgba(0,0,0,.5))}
table.duels{width:100%;border-collapse:collapse;font-size:14px}
table.duels th{text-align:left;padding:6px;border-bottom:1px solid rgba(13,31,92,.25)}
table.duels td{padding:9px 6px;border-bottom:1px solid rgba(13,31,92,.08);vertical-align:top}
table.duels td.w{font-weight:700;color:var(--mostarda)}
table.duels .a{color:var(--muted);font-weight:400;font-size:13px}
table.duels .res{text-align:center;white-space:nowrap;font-family:"Space Mono",monospace}
.actions{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;margin-top:26px}
.coin{width:150px;height:150px;border-radius:50%;margin:20px auto;background:radial-gradient(circle at 35% 30%,#ffe08a,var(--mostarda) 45%,#a8761a);display:flex;align-items:center;justify-content:center;font-family:Anton,Impact,sans-serif;font-size:26px;color:#3a240c;box-shadow:0 10px 30px rgba(232,181,42,.4)}
.coin.spin{animation:flip 1.2s ease-out}
@keyframes flip{to{transform:rotateY(1800deg)}}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--cream);color:#2a1a10;padding:12px 20px;border-radius:999px;font-weight:700;z-index:10;box-shadow:0 10px 30px rgba(0,0,0,.5);max-width:90vw;text-align:center}
textarea.copy{width:100%;min-height:180px;margin-top:14px;border:1px solid rgba(13,31,92,.3);border-radius:10px;padding:10px;background:rgba(0,0,0,.3);color:var(--cream);font:13px/1.4 "Space Mono",monospace}
.rules{color:var(--cream2);font-size:14px;margin:8px 0 0;padding-left:20px}.rules li{margin:5px 0}

.sleeve .cover img{display:block;width:100%;height:100%;object-fit:cover}
.sleeve .cover.collage{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr}
.sleeve .cover.collage img{width:100%;height:100%}
.nocover{width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-size:40px;background:#3e2414}
.mini img{width:100%;height:100%;object-fit:cover;display:block}
/* fundo dinâmico */
#bgwall{position:fixed;inset:-20%;z-index:0;display:flex;gap:14px;transform:rotate(-9deg);opacity:.42;pointer-events:none}
#bgwall .col{flex:1;display:flex;flex-direction:column;gap:14px;animation:colup var(--dur,80s) linear infinite}
#bgwall .col.down{animation-direction:reverse}
#bgwall img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:6px;box-shadow:0 8px 20px rgba(0,0,0,.5)}
@keyframes colup{from{transform:translateY(0)}to{transform:translateY(-50%)}}
#bgshade{position:fixed;inset:0;z-index:0;pointer-events:none;background:
  radial-gradient(ellipse 60% 55% at 50% 40%,rgba(28,18,11,.86),rgba(28,18,11,.62) 70%,rgba(28,18,11,.45)),
  radial-gradient(ellipse 70% 40% at 50% -5%,rgba(255,190,70,.30),transparent 70%),
  linear-gradient(rgba(42,26,16,.35),rgba(28,18,11,.55))}
#floaters{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
#floaters .f{position:absolute;bottom:-60px;animation:floatup var(--d,20s) linear var(--delay,0s) infinite;opacity:.9;filter:drop-shadow(0 4px 10px rgba(255,190,60,.35))}
#floaters .f svg{width:100%;height:100%;display:block;animation:sway 4s ease-in-out infinite alternate}
@keyframes floatup{0%{transform:translateY(0)}100%{transform:translateY(-120vh)}}
@keyframes sway{from{transform:translateX(-12px) rotate(-12deg)}to{transform:translateX(12px) rotate(12deg)}}
.corner{position:fixed;z-index:0;pointer-events:none;filter:drop-shadow(0 10px 25px rgba(0,0,0,.5))}
.corner.c1{left:-50px;bottom:-50px;width:190px}
.corner.c2{right:-40px;top:70px;width:120px;opacity:.85}
.corner svg{width:100%;height:auto;display:block;animation:spin 60s linear infinite}
@media(max-width:680px){.corner.c2{display:none}.corner.c1{width:120px;left:-40px;bottom:-40px}#floaters .f{opacity:.7}}
@media (prefers-reduced-motion:reduce){#bgwall .col,#floaters .f,#floaters .f svg,.corner svg,.record,.minirecord{animation:none!important}#floaters{display:none}}
:root{--sol:#ffc93c}

.tinyflower{display:inline-block;width:22px;height:22px;vertical-align:-3px}
.tinyflower svg{width:100%;height:100%;animation:spin 30s linear infinite}
.nota{font-family:Anton,Impact,sans-serif;font-size:40px;color:var(--sol);line-height:1;margin:10px 0 6px;text-shadow:0 0 18px rgba(255,201,60,.35)}
.bars{width:100%;max-width:240px;margin:6px auto 0}
.bar{display:grid;grid-template-columns:52px 1fr 22px;gap:8px;align-items:center;font-family:"Space Mono",monospace;font-size:11px;color:var(--cream2);margin:4px 0}
.bar span{text-align:right}.bar em{font-style:normal;text-align:left}
.bar i{height:6px;border-radius:999px;background:rgba(13,31,92,.12);overflow:hidden}
.bar b{display:block;height:100%;background:linear-gradient(90deg,var(--amber),var(--sol))}
.why{font-size:13px;color:var(--cream2);margin:10px auto 0;max-width:260px;font-style:italic}
.verdict{margin-top:22px}.verdict p{margin:8px 0 0;font-size:16px}
.prize{display:flex;flex-direction:column;padding:8px 0;border-top:1px solid rgba(13,31,92,.08)}
.prize b em{font-style:normal;color:var(--sol);margin-left:6px}.prize.neg b em{color:#ff9b7a}
.prize span{font-size:13px;color:var(--cream2)}

/* transições */
.view.enter{animation:viewIn .6s cubic-bezier(.2,.7,.2,1) both}
@keyframes viewIn{from{opacity:0;transform:translateY(22px);filter:blur(6px)}to{opacity:1;transform:none;filter:none}}
.view.enter .tot-head,.view.enter .hero{animation:rise .6s .05s both}

.view.enter .pair>.pick:last-child{animation:inR .75s .28s cubic-bezier(.2,.8,.2,1) both}

.view.enter .panel,.view.enter .shelfbox,.view.enter .modebtn,.view.enter .whobtn{animation:rise .7s both}
.view.enter .panel:nth-child(2),.view.enter .shelfbox:nth-child(2),.view.enter .modebtn:nth-child(2),.view.enter .whobtn:nth-child(2){animation-delay:.12s}
.view.enter .prize{animation:rise .5s both}
.view.enter .prize:nth-of-type(1){animation-delay:.2s}.view.enter .prize:nth-of-type(2){animation-delay:.35s}.view.enter .prize:nth-of-type(3){animation-delay:.5s}.view.enter .prize:nth-of-type(4){animation-delay:.65s}.view.enter .prize:nth-of-type(5){animation-delay:.8s}.view.enter .prize:nth-of-type(6){animation-delay:.95s}.view.enter .prize:nth-of-type(7){animation-delay:1.1s}
.view.enter .orderrow{animation:rise .5s both}
.view.enter .orderrow:nth-child(2){animation-delay:.06s}.view.enter .orderrow:nth-child(3){animation-delay:.12s}.view.enter .orderrow:nth-child(4){animation-delay:.18s}.view.enter .orderrow:nth-child(5){animation-delay:.24s}.view.enter .orderrow:nth-child(6){animation-delay:.3s}
.view.enter .bar b{animation:grow 1s .45s cubic-bezier(.2,.8,.2,1) both}
.view.enter .reveal .pick.win .sleeve{animation:winPop 1.1s 1.2s both}
.view.enter .reveal .pick.lose{animation:inL .75s .18s both,dim .6s 1.2s forwards}
.view.enter .reveal .pick.lose:last-child{animation:inR .75s .28s both,dim .6s 1.2s forwards}
.reveal .pick.lose{opacity:1}
.view:not(.enter) .reveal .pick.lose{opacity:.55}
.view.enter .verdict{animation:rise .6s 1.3s both}
.view.enter .score{animation:rise .6s .6s both}
.view.enter .mini{animation:popIn .45s both}
@keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes inL{from{opacity:0;transform:translateX(-60px) rotate(-4deg)}to{opacity:1;transform:none}}
@keyframes inR{from{opacity:0;transform:translateX(60px) rotate(4deg)}to{opacity:1;transform:none}}
@keyframes popIn{0%{opacity:0;transform:scale(.4)}70%{transform:scale(1.12)}100%{opacity:1;transform:scale(1)}}
@keyframes grow{from{width:0}}
@keyframes winPop{0%{transform:scale(1)}35%{transform:scale(1.07) rotate(-1.5deg)}100%{transform:scale(1)}}
@keyframes dim{to{opacity:.55}}
.pick.chosen .sleeve{animation:chosen .45s cubic-bezier(.2,.8,.2,1) forwards}

/* ===== estilo brasil ===== */
:root{--br-verde:#2fb36a;--br-amarelo:#ffc93c;--br-azul:#e8433a}
.calcadao{position:fixed;left:0;right:0;height:14px;z-index:0;pointer-events:none;background-image:url("data:image/svg+xml;utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='120' height='24' viewBox='0 0 120 24'%3E%3Cpath d='M0 12 C 15 0, 45 0, 60 12 S 105 24, 120 12' fill='none' stroke='%23f6e7c9' stroke-width='5' stroke-linecap='round' opacity='.9'/%3E%3C/svg%3E");background-size:120px 14px;opacity:.16;animation:waves 18s linear infinite}
.calcadao.top{top:0}.calcadao.bottom{bottom:0;animation-direction:reverse}
@keyframes waves{to{background-position:120px 0}}
.tot-head h2{position:relative;display:inline-block}
.tot-head h2::after{content:"";display:block;height:10px;margin:8px auto 0;width:min(240px,70%);background-image:url("data:image/svg+xml;utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='120' height='24' viewBox='0 0 120 24'%3E%3Cpath d='M0 12 C 15 0, 45 0, 60 12 S 105 24, 120 12' fill='none' stroke='%23f6e7c9' stroke-width='5' stroke-linecap='round' opacity='.9'/%3E%3C/svg%3E");background-size:60px 10px;opacity:.55;animation:waves 6s linear infinite}
.sl{display:inline-block;animation:samba .7s cubic-bezier(.3,1.6,.5,1) both}
@keyframes samba{0%{opacity:0;transform:translateY(24px) rotate(10deg) scale(.6)}60%{opacity:1;transform:translateY(-6px) rotate(-4deg)}100%{transform:none}}
.btn{position:relative;overflow:hidden}
.btn::after{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 30%,rgba(255,255,255,.35) 50%,transparent 70%);transform:translateX(-120%);transition:transform .6s}
.btn:hover::after{transform:translateX(120%)}
.ou{animation:pandeiro 2.4s ease-in-out infinite}
@keyframes pandeiro{0%,80%,100%{transform:rotate(0)}84%{transform:rotate(-14deg)}88%{transform:rotate(12deg)}92%{transform:rotate(-8deg)}96%{transform:rotate(5deg)}}
.view.enter .ou{animation:popIn .5s .55s both,pandeiro 2.4s 1.2s ease-in-out infinite}
.record::after{background:radial-gradient(circle,#1c120b 0 7%,var(--br-amarelo) 8% 45%,var(--br-verde) 46% 62%,var(--terra) 63%)}
.whobtn:hover .n,.modebtn:hover b{animation:samba .6s both}
.progress div{background:linear-gradient(90deg,var(--br-verde),var(--br-amarelo),var(--terra));background-size:200% 100%;animation:flow 3s linear infinite}
@keyframes flow{to{background-position:200% 0}}
.flyer{position:fixed;z-index:60;pointer-events:none;border-radius:4px;overflow:hidden;box-shadow:0 20px 40px rgba(0,0,0,.6),0 0 0 3px var(--sol)}
.flyer img{width:100%;height:100%;object-fit:cover;display:block}
/* intertítulo */
.inter{position:fixed;inset:0;z-index:70;pointer-events:none;overflow:hidden}
.inter i{position:absolute;top:-20%;bottom:-20%;width:60%;transform:skewX(-18deg) translateX(-180%);animation:band 1.6s cubic-bezier(.7,0,.3,1) forwards}
.inter .b1{left:-10%;background:var(--br-verde)}
.inter .b2{left:20%;background:var(--br-amarelo);animation-delay:.07s}
.inter .b3{left:50%;background:var(--terra);animation-delay:.14s}
@keyframes band{0%{transform:skewX(-18deg) translateX(-220%)}38%,62%{transform:skewX(-18deg) translateX(0)}100%{transform:skewX(-18deg) translateX(260%)}}
.inter .it{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;animation:itxt 1.6s ease forwards;color:#2a160a;text-align:center}

.inter .iflower{width:64px;height:64px;animation:spin 1.6s linear}
.inter .iflower svg{width:100%;height:100%}
@keyframes itxt{0%,20%{opacity:0;transform:scale(.7)}35%{opacity:1;transform:scale(1.04)}55%{transform:scale(1)}68%{opacity:1}82%,100%{opacity:0;transform:scale(1.1)}}

.oside{position:sticky;top:12px;max-height:calc(100vh - 24px);overflow:auto}

input[type=text]{background:#fff!important;border:2px solid var(--ink)!important;color:var(--ink)!important}
input[type=text]::placeholder{color:#9aa3c2}
.c0{color:var(--blue)!important}
.c1{color:var(--ink)!important;background:linear-gradient(transparent 58%,var(--yellow) 58%);padding:0 .08em}
.num.c1,.sc.c1,.heroword .c1{background:none}
.score .num.c1{color:#d9b400!important;-webkit-text-stroke:1.5px var(--ink)}
/* jogo */
.pedido{background:var(--yellow)!important;border:2px solid var(--ink)!important;color:var(--ink);box-shadow:4px 4px 0 var(--ink)}
.pedido .mono,.pedido span:last-child{color:var(--ink)!important}.pedido b{color:var(--ink)!important;font-family:'Playfair Display',serif}
.progress{background:rgba(13,31,92,.1)!important}
.progress div,.timer .tb{background:var(--green)!important}
.timer .tbw{background:rgba(13,31,92,.12)!important}
.timer .tl{color:var(--ink)!important}.timer.low .tb{background:#d93025!important}.timer.low .tl{color:#d93025!important}
.tags .tg-g{background:#fff!important;border:1.5px solid var(--ink)!important;color:var(--ink)!important}
.tags .tg-e{background:#fff;border:1.5px solid var(--ink)!important;color:var(--ink)!important}
.tags .tg-e i{background:rgba(13,31,92,.15)!important}.tags .tg-e i.on{background:var(--green)!important}
.tags .tg-t{background:var(--yellow)!important;border:1.5px solid var(--ink)!important;color:var(--ink)!important}
.legend{color:var(--cream2)}.legend b{border:1.5px solid var(--ink)!important;color:var(--ink)!important;background:#fff!important}.legend .lg-t{background:var(--yellow)!important}
.pick .tt{color:var(--ink);font-family:'Playfair Display',Georgia,serif;font-weight:900}
.pick .ta{color:var(--cream2)}
.listen a{color:var(--blue)!important}
.sleeve .cover{box-shadow:6px 6px 0 var(--ink)!important;border:2px solid var(--ink);border-radius:2px!important}
.pick.win .sleeve .cover,.pick.chosen .sleeve .cover{box-shadow:6px 6px 0 var(--green),0 0 0 4px var(--yellow)!important}
.ou{background:var(--yellow)!important;color:var(--ink)!important;border:2px solid var(--ink);border-radius:50%;width:64px;height:64px;display:flex!important;align-items:center;justify-content:center;font-size:24px!important;text-shadow:none!important;margin:auto}
.shelfbox h3{font-family:'Playfair Display',serif;font-weight:900}
.plank{background:var(--ink)!important;box-shadow:none!important;height:8px!important}
.row .slot{border:2px dashed rgba(13,31,92,.25)!important}
.mini{box-shadow:3px 3px 0 var(--ink)!important;border:1.5px solid var(--ink)}
.mini .lab{background:var(--ink)!important;color:#fff!important}
.shelfbox .list li{border-color:rgba(13,31,92,.12)!important}
.orow{background:#fff!important;border:2px solid var(--ink);box-shadow:3px 3px 0 var(--ink)}
.orow .n{font-family:Anton,sans-serif!important;color:var(--green)!important}
.orow .thumb img{border:1.5px solid var(--ink);box-shadow:none}
.mv{background:#fff!important;border:2px solid var(--ink)!important;color:var(--ink)!important}
.olink{color:var(--cream2)!important}.olink.good{border-color:var(--green)!important}.olink.good .lp{color:var(--green)!important}
.olink.ok{border-color:#d9b400!important}.olink.ok .lp{color:#a88a00!important}.olink.bad .lp{color:#d93025!important}.olink.bad{border-color:#d93025!important}
.otot,.dock-tot{color:var(--green)!important;font-family:Anton,sans-serif!important}
.ck{border-color:rgba(13,31,92,.12)!important}.ck b{color:var(--ink)}.ck span{color:var(--cream2)!important}
.ck .ci{border:2px solid var(--ink)!important;color:var(--ink)!important;background:#fff}
.ck.ok .ci{background:var(--green)!important;color:#fff!important}.ck.bad .ci{background:#d93025!important;color:#fff!important}
.ck em{color:var(--muted)}.ck.ok em{color:var(--green)!important}.ck.bad em{color:#d93025!important}
.odock{background:#fffdf7!important;border-top:3px solid var(--ink)!important;box-shadow:0 -6px 0 var(--yellow)!important}
.dicons i{background:rgba(13,31,92,.08)!important}.dicons i.ok{background:var(--yellow)!important;box-shadow:0 0 0 1.5px var(--ink)!important;filter:none;opacity:1}
.dsum small{color:var(--blue)!important}
/* duelos e resultados */
.nota{color:var(--green)!important;font-family:Anton,sans-serif!important;text-shadow:none!important}
.bar{color:var(--cream2)!important}.bar i{background:rgba(13,31,92,.12)!important}.bar b{background:var(--green)!important}
.why{color:var(--cream2)!important}
.owner{letter-spacing:.12em}
.verdict{background:var(--yellow)!important}.verdict .mono{color:var(--ink)!important}
.score .num{font-family:Anton,sans-serif!important}.score .num.c0{color:var(--blue)!important}
.score .lbl{color:var(--cream2)}.score .dash{color:var(--muted)}
.prow{border-color:rgba(13,31,92,.12)!important}.prow b{color:var(--ink)}.prow span{color:var(--cream2)!important}.prow em{color:var(--green)!important}
.sr{border-color:rgba(13,31,92,.12)!important}.sr .sl{color:var(--cream2)!important}.sc{color:var(--ink)}
.sr.tot .sc.lead{background:var(--yellow)!important;color:var(--ink)!important;box-shadow:inset 0 0 0 2px var(--ink)!important}
.sc.big{font-family:Anton,sans-serif!important}
.winner h1{font-family:Anton,Impact,sans-serif!important;text-transform:uppercase;font-size:clamp(48px,10vw,110px)!important;color:var(--ink)!important;text-shadow:5px 5px 0 var(--yellow)!important}
.winner h1.c1{background:none}
.winner .by{color:var(--cream2)!important}
.myrank b,.rscore{color:var(--green)!important;font-family:Anton,sans-serif!important}
.rrow{background:#fff!important;border:2px solid var(--ink)!important;box-shadow:3px 3px 0 var(--ink);margin-bottom:10px;border-radius:12px;padding:12px!important}
.rpos{color:var(--ink)!important}
.rcov{border:1.5px solid var(--ink);box-shadow:none!important}
table.duels th{border-color:var(--ink)!important}table.duels td{border-color:rgba(13,31,92,.12)!important}table.duels td.w{color:var(--green)!important}
.toast{background:var(--ink)!important;color:#fff!important;border:2px solid var(--yellow)}
.codepill{background:var(--yellow)!important;color:var(--ink)!important;border:2px solid var(--ink)}
.bigcode{color:var(--ink)!important;text-shadow:5px 5px 0 var(--yellow)!important;font-family:Anton,sans-serif!important}
.dot{background:#c3c9dd}.dot.on{background:var(--green)!important;box-shadow:0 0 0 3px rgba(0,156,59,.25)!important}
.err{background:#fde8e6!important;border:2px solid #d93025!important;color:#a1170d!important}
.hint{color:var(--muted)!important}
details summary{color:var(--blue)!important}
.minirecord{box-shadow:4px 4px 0 var(--yellow)!important}
.record{box-shadow:0 0 0 6px var(--ink),10px 10px 0 6px var(--green)!important}
.coverwrap:not(.lose) .sleeve .cover{box-shadow:8px 8px 0 var(--green),0 0 0 4px var(--yellow)!important}
.sleeve .sticker{background:var(--yellow)!important;border:2px solid var(--ink);color:var(--ink)!important}
.sleeve .sticker small{color:var(--ink)!important}
.coin{border:3px solid var(--ink)}
.inter{animation-name:interCream!important}
@keyframes interCream{0%{background:rgba(247,243,232,0)}30%,60%{background:rgba(247,243,232,.82)}100%{background:rgba(247,243,232,0)}}
.inter .it{color:var(--ink)!important}.inter .it b{font-family:Anton,sans-serif!important;text-transform:uppercase;text-shadow:3px 3px 0 var(--yellow)!important}
.inter .it small{color:var(--ink)!important}
.flyer{box-shadow:6px 6px 0 var(--ink),0 0 0 3px var(--yellow)!important}
.view.enter .panel,.view.enter .orow,.view.enter .rrow{animation:cleanIn .45s ease-out both!important}

.leaf{opacity:1!important}
.bigword{-webkit-mask:none!important;mask:none!important;opacity:.38!important;color:var(--yellow)!important}
@keyframes bwIn{from{opacity:0;letter-spacing:.12em}to{opacity:.38;letter-spacing:-.01em}}

/* ================= PRAIA AO PÔR DO SOL ================= */
body{background:#fde9cf!important}
#beach{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none}
#beach .sky{position:absolute;inset:0;background:linear-gradient(180deg,#fff1dc 0%,#ffe1b8 26%,#ffc488 44%,#ff9f6e 56%,#ff8466 63%,#f77a6f 66%)}
#beach .sun{position:absolute;left:50%;top:66%;width:min(30vw,260px);aspect-ratio:1;transform:translate(-50%,-62%);border-radius:50%;background:radial-gradient(circle at 50% 45%,#fff6c2,#FFD700 45%,#ffb43b 75%,#ff8a3d);animation:sunpulse 6s ease-in-out infinite}
#beach .sunglow{position:absolute;left:50%;top:66%;width:min(90vw,800px);aspect-ratio:1;transform:translate(-50%,-55%);border-radius:50%;background:radial-gradient(circle,rgba(255,215,0,.45),rgba(255,160,90,.18) 40%,transparent 68%);animation:glow 6s ease-in-out infinite}
@keyframes sunpulse{50%{transform:translate(-50%,-60%) scale(1.02)}}@keyframes glow{50%{opacity:.75}}
#beach .cloud{position:absolute;height:14px;border-radius:999px;background:rgba(255,255,255,.55);filter:blur(1px)}
#beach .cloud::after{content:"";position:absolute;left:18%;top:-8px;width:45%;height:16px;border-radius:999px;background:inherit}
#beach .c1{top:18%;width:180px;animation:drift 90s linear infinite}#beach .c2{top:30%;width:120px;animation:drift 120s -40s linear infinite;opacity:.7}#beach .c3{top:12%;width:240px;animation:drift 150s -90s linear infinite;opacity:.5}
@keyframes drift{from{transform:translateX(-30vw)}to{transform:translateX(130vw)}}
#beach .gull{position:absolute;width:34px;animation:fly 38s linear infinite}
#beach .gull svg{width:100%;animation:flap .9s ease-in-out infinite}
#beach .g1{top:24%;animation-delay:-5s}#beach .g2{top:30%;width:24px;animation-delay:-18s;animation-duration:46s}#beach .g3{top:20%;width:20px;animation-delay:-30s;animation-duration:52s}
@keyframes fly{from{transform:translate(-10vw,0)}50%{transform:translate(55vw,-30px)}to{transform:translate(115vw,10px)}}
@keyframes flap{50%{transform:scaleY(.4)}}
#beach .sea{position:absolute;left:0;right:0;top:66%;height:22%;background:linear-gradient(180deg,#5a63b8 0%,#3150c2 30%,#1f45b8 65%,#1338BE);overflow:hidden}
#beach .shine{position:absolute;left:50%;top:0;width:min(26vw,220px);height:100%;transform:translateX(-50%);background:repeating-linear-gradient(180deg,rgba(255,226,140,.85) 0 3px,transparent 3px 12px);-webkit-mask:linear-gradient(180deg,#000,transparent);mask:linear-gradient(180deg,#000,transparent);animation:shimmer 2.4s ease-in-out infinite}
@keyframes shimmer{50%{opacity:.55;transform:translateX(-50%) scaleX(.85)}}
#beach .wv{position:absolute;left:0;right:0;height:26px;overflow:hidden}
#beach .wv>div{width:200%;height:100%;animation:wave 14s linear infinite}
#beach .wv svg{width:100%;height:100%;display:block}
#beach .w1{top:28%}#beach .w2{top:52%}#beach .w2>div{animation-duration:10s;animation-direction:reverse}#beach .w3{top:76%}#beach .w3>div{animation-duration:8s}
@keyframes wave{to{transform:translateX(-50%)}}
#beach .sand{position:absolute;left:0;right:0;top:86%;bottom:0;background:linear-gradient(180deg,#f2d39d,#ecc482 60%,#e5b873)}
#beach .wet{position:absolute;left:0;right:0;top:0;height:40%;background:linear-gradient(180deg,rgba(150,110,70,.35),transparent);animation:wet 8s ease-in-out infinite}
#beach .foam{position:absolute;left:-5%;right:-5%;top:-14px;height:34px;animation:shore 8s ease-in-out infinite}
#beach .foam svg{width:100%;height:100%;display:block}
@keyframes shore{0%,100%{transform:translateY(0) scaleY(.7);opacity:.65}45%{transform:translateY(26px) scaleY(1.1);opacity:1}70%{transform:translateY(14px);opacity:.8}}
@keyframes wet{0%,100%{opacity:.4}50%{opacity:1}}
@media (prefers-reduced-motion:reduce){#beach *{animation:none!important}}
body::before{content:"";position:fixed;inset:0;z-index:1;pointer-events:none;background:url("data:image/svg+xml;utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='220' height='220'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3' stitchTiles='stitch'/%3E%3CfeColorMatrix values='0 0 0 0 .05 0 0 0 0 .12 0 0 0 0 .36 0 0 0 .07 0'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");opacity:.5}
.leaf{z-index:2}
/* legibilidade sobre o céu */
.tot-head h2,.tot-head .sub,.tot-head .mono,.meta,.hero p,.winner .by,.winner .mono,.suspense .mono{text-shadow:0 0 14px rgba(255,241,220,.95),0 0 4px rgba(255,241,220,.9)}
.bigword{color:#fff!important;opacity:.55!important}
@keyframes bwIn{from{opacity:0;letter-spacing:.12em}to{opacity:.55;letter-spacing:-.01em}}
/* Clara em amarelo */
.c1{color:#FFD700!important;background:none!important;padding:0!important;text-shadow:-1px -1px 0 #0d1f5c,1px -1px 0 #0d1f5c,-1px 1px 0 #0d1f5c,1px 1px 0 #0d1f5c,2px 2px 0 #0d1f5c!important}
.score .num.c1,.sc.c1,.winner h1.c1{-webkit-text-stroke:0!important}
.hero .vs .c1,.winner h1.c1{text-shadow:-2px -2px 0 #0d1f5c,2px -2px 0 #0d1f5c,-2px 2px 0 #0d1f5c,2px 2px 0 #0d1f5c,4px 4px 0 #0d1f5c!important}
.tally span[style*="--p1"]{color:#0d1f5c!important;border:1.5px solid #0d1f5c}
:root{--p1:#FFD700}
/* som */
.sndbtn{width:38px;height:38px;border-radius:50%;border:2px solid var(--ink);background:#fffdf7;font-size:17px;cursor:pointer;box-shadow:3px 3px 0 var(--ink);transition:transform .2s,box-shadow .2s,background .2s;flex:none}
.sndbtn.on{background:var(--yellow);animation:sndpulse 1.9s ease-in-out infinite}
.sndbtn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
@keyframes sndpulse{50%{box-shadow:3px 3px 0 var(--ink),0 0 0 6px rgba(255,215,0,.35)}}
/* smooth & prático */
.btn,.chip,.mv,.linkbtn,.modebtn,.whobtn,.orow,.rrow{transition:transform .22s cubic-bezier(.2,.8,.2,1),box-shadow .22s,background .22s,filter .2s}
.btn:hover{transform:translate(-2px,-2px)}.btn:hover{box-shadow:6px 6px 0 var(--ink)!important}
.pick.tappable{cursor:pointer}
.pick.tappable .sleeve{transition:transform .35s cubic-bezier(.2,.8,.2,1)}
.pick.tappable:hover .sleeve{transform:translateY(-6px) rotate(-1.5deg)}
.pick.tappable:active .sleeve{transform:scale(.97)}
.orow:hover{transform:translateX(3px)}
.rrow:hover{transform:translateY(-2px);box-shadow:5px 5px 0 var(--ink)}
.view.enter{animation:smoothIn .5s cubic-bezier(.2,.8,.2,1) both!important}
@keyframes smoothIn{from{opacity:0;transform:translateY(14px) scale(.995)}to{opacity:1;transform:none}}
.view.enter .panel,.view.enter .orow,.view.enter .rrow,.view.enter .modebtn{animation:smoothIn .55s cubic-bezier(.2,.8,.2,1) both!important}
.view.enter .orow:nth-child(odd){animation-delay:.04s!important}
.view.enter .pair>.pick:first-child{animation:slideL .6s cubic-bezier(.2,.8,.2,1) both!important}
.view.enter .pair>.pick:last-child{animation:slideR .6s .08s cubic-bezier(.2,.8,.2,1) both!important}
@keyframes slideL{from{opacity:0;transform:translateX(-36px)}}@keyframes slideR{from{opacity:0;transform:translateX(36px)}}
html{scroll-behavior:smooth}
/* telemóvel */
@media(max-width:600px){
  .top{position:sticky;top:0;z-index:30;margin:-12px -12px 14px;padding:10px 12px;background:rgba(255,241,220,.88);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:2px solid var(--ink)}
  .logo{font-size:20px!important}.topr{gap:8px!important}.sndbtn{width:32px;height:32px;font-size:14px;box-shadow:2px 2px 0 var(--ink)}
  .tot-head h2{font-size:36px!important}.bigword{font-size:88px}
  .heroword{font-size:92px;text-shadow:4px 4px 0 var(--green)}.heroword span:last-child{text-shadow:4px 4px 0 var(--blue)}
  .hero .turntable{width:130px;height:130px;margin-top:-46px}
  .pick .btn{padding:12px 10px!important;font-size:13px}
  .ou{width:46px!important;height:46px!important;font-size:18px!important}
  .pick .tags{gap:3px}.tags span{font-size:10px;padding:1px 6px}
  .panel{box-shadow:4px 4px 0 var(--ink)!important}
  .modes{gap:12px}.modebtn{padding:16px!important}
}
@media(min-width:1100px){#app{max-width:1080px}}

/* ===== legibilidade: conteúdo num cartão de vidro ===== */
#beach .sky{background:linear-gradient(180deg,#fff1dc 0%,#ffe1b8 30%,#ffc488 52%,#ff9f6e 66%,#ff8466 74%,#f77a6f 78%)!important}
#beach .sun,#beach .sunglow{top:78%!important}
#beach .sea{top:78%!important;height:13%!important}
#beach .sand{top:91%!important}
main.view{background:rgba(255,248,236,.86);backdrop-filter:blur(12px) saturate(1.1);-webkit-backdrop-filter:blur(12px) saturate(1.1);border:2px solid var(--ink);border-radius:22px;padding:22px 22px 28px;box-shadow:8px 8px 0 rgba(13,31,92,.85);margin-bottom:24px}
.tot-head h2,.tot-head .sub,.tot-head .mono,.meta,.hero p,.winner .by,.winner .mono,.suspense .mono{text-shadow:none!important}
.hero .vs{margin-top:6px}
.top{position:relative;z-index:5}
/* barra fixa do pedido + tempo enquanto escolhes */
.dstick{position:sticky;top:8px;z-index:20;background:rgba(255,248,236,.96);border-radius:16px;padding:8px 0 2px;margin:-4px 0 12px}
.dstick .pedido{margin:0 0 8px!important;padding:8px 12px!important}
.dstick .timer{margin:0 4px 4px}
/* prateleiras fixas em baixo */
.ddock{position:fixed;left:50%;transform:translateX(-50%);bottom:10px;z-index:40;width:min(1040px,calc(100% - 20px));background:#fffdf7;border:2px solid var(--ink);border-radius:18px;box-shadow:5px 5px 0 var(--ink);padding:10px 12px 10px;animation:ddIn .5s cubic-bezier(.2,.8,.2,1) both}
@keyframes ddIn{from{transform:translate(-50%,120%)}}
body.has-ddock #app{padding-bottom:170px}
.drow2{display:grid;grid-template-columns:86px 1fr;gap:10px;align-items:center;padding:4px 0}
.drow2+.drow2{border-top:1px dashed rgba(13,31,92,.2)}
.dlab{display:flex;flex-direction:column;line-height:1.1;min-width:0}.dlab b{font-family:'Playfair Display',serif;font-weight:900;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.dlab small{font-size:11px;color:var(--muted)}
.dslots{display:grid;grid-template-columns:repeat(var(--n),minmax(0,48px));gap:6px}
.dslots .slot,.dmini{aspect-ratio:1;border-radius:4px}
.dslots .slot{border:2px dashed rgba(13,31,92,.25)}
.dmini{overflow:hidden;border:1.5px solid var(--ink);animation:popIn .45s cubic-bezier(.2,.8,.2,1) both}
.dmini img{width:100%;height:100%;object-fit:cover;display:block}
.dtoggle{position:absolute;right:12px;top:-16px;background:var(--yellow);border:2px solid var(--ink);border-radius:999px;font:700 12px "DM Sans",sans-serif;color:var(--ink);padding:4px 12px;cursor:pointer}
.dlist{display:none;grid-template-columns:1fr 1fr;gap:14px;max-height:40vh;overflow:auto;padding:6px 2px 10px;border-bottom:1px dashed rgba(13,31,92,.2);margin-bottom:6px}
.ddock.open .dlist{display:grid}
.dlist b{font-family:'Playfair Display',serif;font-weight:900}
.dlist ol{list-style:none;margin:6px 0 0;padding:0;font-size:13px}.dlist li{padding:3px 0}.dlist li span{color:var(--muted);font-family:"Space Mono",monospace;font-size:11px}.dlist em{color:var(--muted);font-style:normal}
@media(max-width:600px){
  main.view{padding:14px 12px 20px;border-radius:16px;box-shadow:5px 5px 0 rgba(13,31,92,.85);margin:0 -2px 18px}
  .dstick{top:62px}
  .ddock{bottom:0;width:100%;border-radius:16px 16px 0 0;border-bottom:0;box-shadow:0 -4px 0 var(--ink);padding:10px 10px calc(10px + env(safe-area-inset-bottom))}
  .drow2{grid-template-columns:54px 1fr;gap:8px}.dlab b{font-size:13px}
  .dslots{gap:4px;grid-template-columns:repeat(var(--n),minmax(0,1fr))}
  .dlist{grid-template-columns:1fr;max-height:45vh}
  body.has-ddock #app{padding-bottom:150px}
  .pair .tt{font-size:17px!important;line-height:1.15}
  .pick .info{min-width:0}.pick .tt,.pick .ta{overflow-wrap:anywhere}
  .hero .vs{font-size:40px!important}
}
/* sem sobreposições */
.pick .info{width:100%}
.pick .tags{justify-content:center}
.tot-head .sub{max-width:640px;margin-left:auto;margin-right:auto}
.meta{gap:8px}

.hero .turntable{margin:14px auto 6px!important}
.pdot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;border:1.5px solid var(--ink);vertical-align:0}
.pdot.p0{background:var(--blue)}.pdot.p1{background:var(--yellow)}
.dlab b{font-family:"DM Sans",sans-serif!important;font-weight:700!important}
.pair .sleeve{width:min(230px,26vh,40vw)!important}
@media(min-width:601px){
  .ddock{display:grid;grid-template-columns:1fr 1fr;gap:6px 22px;padding:12px 16px}

function art(seed){
  const r=rng(hash(seed)),pk=()=>ART[Math.floor(r()*ART.length)];
  let bg=pk(),a=pk(),b=pk();while(b===a)b=pk();if(a===bg)a=ART[(ART.indexOf(a)+4)%ART.length];
  const st=Math.floor(r()*5);let s=`<rect width="300" height="300" fill="${bg}"/>`;
  if(st===0){ // sunburst tropicália
    const cx=150,cy=120+r()*40,n=18;
    for(let k=0;k<n;k+=2){const a1=k/n*Math.PI*2,a2=(k+1)/n*Math.PI*2;s+=`<path d="M${cx} ${cy} L${cx+400*Math.cos(a1)} ${cy+400*Math.sin(a1)} L${cx+400*Math.cos(a2)} ${cy+400*Math.sin(a2)}Z" fill="${a}" opacity=".9"/>`}
    s+=`<circle cx="${cx}" cy="${cy}" r="${40+r()*25}" fill="${b}"/><circle cx="${cx}" cy="${cy}" r="${18+r()*10}" fill="${bg}" opacity=".8"/>`;
  }else if(st===1){ // pôr do sol + palmeira
    s+=`<rect width="300" height="170" fill="${a}"/><circle cx="${110+r()*80}" cy="170" r="${60+r()*25}" fill="${b}"/>`;
    for(let k=0;k<6;k++)s+=`<rect y="${170+k*22}" width="300" height="11" fill="${k%2?bg:'#1c120b'}" opacity="${.35+k*.1}"/>`;
    const px=40+r()*40;s+=`<path d="M${px} 300 Q ${px+18} 210 ${px+48} 120" stroke="#1c120b" stroke-width="7" fill="none"/>`;
    for(let k=0;k<6;k++){const ang=-2.6+k*.9,ex=px+48+70*Math.cos(ang),ey=120+50*Math.sin(ang)+20;s+=`<path d="M${px+48} 120 Q ${(px+48+ex)/2} ${ey-30} ${ex} ${ey}" stroke="#1c120b" stroke-width="9" fill="none" stroke-linecap="round"/>`}
  }else if(st===2){ // folhas
    for(let k=0;k<9;k++){const x=r()*300,y=r()*300,rot=r()*360,c=k%2?a:b;s+=`<g transform="translate(${x} ${y}) rotate(${rot})"><ellipse rx="${50+r()*30}" ry="${16+r()*8}" fill="${c}"/><line x1="-60" x2="60" stroke="${bg}" stroke-width="2" opacity=".6"/></g>`}
  }else if(st===3){ // arco-íris 70s
    const cx=r()<.5?0:300,cols=[a,b,pk(),pk(),bg==='#f6e7c9'?'#d9603b':'#f6e7c9'];
    for(let k=0;k<5;k++)s+=`<circle cx="${cx}" cy="300" r="${260-k*42}" fill="${cols[k]}"/>`;
  }else{ // ondas
    for(let k=0;k<6;k++){const y=50+k*45;s+=`<path d="M0 ${y} Q 75 ${y-30-r()*30} 150 ${y} T 300 ${y} V 300 H 0Z" fill="${k%2?a:b}" opacity="${.55+r()*.45}"/>`}
    s+=`<circle cx="${60+r()*180}" cy="${40+r()*30}" r="${16+r()*18}" fill="#f6e7c9"/>`;
  }
  // grão
  for(let k=0;k<40;k++)s+=`<circle cx="${r()*300}" cy="${r()*300}" r="${r()*1.6}" fill="#000" opacity=".15"/>`;
  return {svg:`<svg viewBox="0 0 300 300" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">${s}</svg>`,lbl:b};
}

  const persist=()=>{if(role==='host'){try{localStorage.setItem('ma-host-'+hostCode,JSON.stringify(local['salas/'+hostCode]))}catch(e){}}};
  function apply(p,d,whole){local[p]=whole?JSON.parse(JSON.stringify(d)):deepMerge(local[p]||{},JSON.parse(JSON.stringify(d)));emit(p);if(role==='host'){persist();send({t:'state',code:hostCode,doc:local[p]})}}
  function onData(m){
    if(!m||typeof m!=='object')return;
    if(m.t==='state'&&role==='guest'&&m.code===hostCode&&m.doc){local['salas/'+m.code]=m.doc;emit('salas/'+m.code);waiters.splice(0).forEach(r=>r(true))}
    else if(m.t==='write'&&role==='host'&&typeof m.path==='string'&&m.path==='salas/'+hostCode){apply(m.path,m.data||{},!!m.whole)}
    else if(m.t==='albuns'&&m.items&&typeof m.items==='object'){let ch=false;for(const k in m.items){const v=m.items[k];if(!albuns[k]&&v&&typeof v.score==='number'){albuns[k]=v;ch=true}}if(ch){saveAlb();emitAlb()}}
  }
  function wire(c){conn=c;c.on('open',()=>{api.onPeer&&api.onPeer(true);send({t:'albuns',items:albuns});if(role==='host'&&local['salas/'+hostCode])send({t:'state',code:hostCode,doc:local['salas/'+hostCode]})});
    c.on('data',onData);c.on('close',()=>{api.onPeer&&api.onPeer(false);if(role==='guest'&&conn===c)setTimeout(()=>api.connectGuest(hostCode),2000)});c.on('error',()=>{})}
  const api={p2p:true,onPeer:null,
    host(code,tries=0){role='host';hostCode=code;if(!local['salas/'+code]){try{const s=localStorage.getItem('ma-host-'+code);if(s)local['salas/'+code]=JSON.parse(s)}catch(e){}}
      return new Promise((res,rej)=>{try{peer&&peer.destroy()}catch(e){}peer=new Peer('meualbum-mc-'+code);
        peer.on('open',()=>res(true));
        peer.on('connection',c=>{try{if(conn&&conn.open)conn.close()}catch(e){}wire(c)});
        peer.on('error',e=>{if(e.type==='unavailable-id'){if(tries<6)setTimeout(()=>api.host(code,tries+1).then(res,rej),2500);else rej({code:'taken'})}else if(e.type!=='peer-unavailable')rej({code:'unavailable'})});

    connectGuest(code){role='guest';hostCode=code;return new Promise(res=>{let done=false;const fin=v=>{if(!done){done=true;res(v)}};waiters.push(fin);setTimeout(()=>fin(false),10000);
      const go=()=>{const c=peer.connect('meualbum-mc-'+code,{reliable:true});wire(c)};
      if(!peer||peer.destroyed){peer=new Peer();peer.on('open',go);peer.on('error',e=>{if(e.type==='peer-unavailable')fin(false)})}else go()})},
    doc:p=>({
      get:async()=>{if(p.startsWith('salas/')&&!(p in local)&&!(role==='host'&&hostCode===p.slice(6))){const ok=await api.connectGuest(p.slice(6));if(!ok)return snapOf('salas/__none__')}return snapOf(p)},
      set:async d=>{if(p.startsWith('albuns/')){const id=p.slice(7);albuns[id]=JSON.parse(JSON.stringify(d));saveAlb();emitAlb();send({t:'albuns',items:{[id]:albuns[id]}});cloudPut(id,albuns[id]).catch(()=>{});return}
        if(role==='guest'){local[p]=JSON.parse(JSON.stringify(d));emit(p);send({t:'write',path:p,data:d,whole:true})}else apply(p,d,true)},
      update:async d=>{if(role==='guest'){local[p]=deepMerge(local[p]||{},JSON.parse(JSON.stringify(d)));emit(p);send({t:'write',path:p,data:d,whole:false})}else apply(p,d,false)},
      onSnapshot:(fn)=>{(subs[p]=subs[p]||[]).push(fn);setTimeout(()=>fn(snapOf(p)),0);return()=>{subs[p]=(subs[p]||[]).filter(f=>f!==fn)}}}),
    collection:()=>{let lim=99;const q={orderBy:()=>q,limit:n=>{lim=n;return q},
      get:async()=>({docs:Object.entries(albuns).map(([id,d])=>({id,exists:true,data:()=>d})).sort((a,b)=>b.data().score-a.data().score).slice(0,lim)}),
      onSnapshot:fn=>{const f=()=>q.get().then(fn);albSubs.add(f);f();cloudSync();const iv=setInterval(cloudSync,20000);return()=>{albSubs.delete(f);clearInterval(iv)}}};return q}};
  return api;
}

/* salas online pelo Firestore (funciona em qualquer rede, sem depender do telemóvel de quem cria) */
const FS_DOCS='https://firestore.googleapis.com/v1/projects/meualbum-ace50/databases/(default)/documents';
function makeCloudDb(){
  const base=makeP2PDb(),origDoc=base.doc;base.p2p=false;base.cloud=true;
  const cache={},subs={},polls={};
  const url=(p,q)=>`${FS_DOCS}/${p}?key=${FS_KEY}${q||''}`;
  const parse=j=>{try{return JSON.parse(j.fields.s.stringValue)}catch(e){return null}};
  async function fetchRoom(code){const r=await fetch(url('salas/'+code),{cache:'no-store'});
    if(r.status===404)return {exists:false};if(!r.ok)throw {code:r.status===403?'denied':'unavailable'};
    const j=await r.json();return {exists:true,data:parse(j),ut:j.updateTime}}
  async function putRoom(code,data,pre){const r=await fetch(url('salas/'+code,pre||''),{method:'PATCH',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({fields:{s:{stringValue:JSON.stringify(data)},at:{stringValue:new Date().toISOString()}}})});
    if(r.ok){const j=await r.json();return {ok:true,ut:j.updateTime}}return {ok:false,st:r.status}}
  const snap=(code)=>{const c=cache[code];return {id:code,exists:!!(c&&c.exists),data:()=>c&&c.data?JSON.parse(JSON.stringify(c.data)):undefined,metadata:{fromCache:false}}};
  const emit=code=>(subs[code]||[]).slice().forEach(fn=>{try{fn(snap(code))}catch(e){}});
  async function poll(code){if(polls[code]&&polls[code].busy)return;const P_=polls[code];if(P_)P_.busy=true;
    try{const r=await fetchRoom(code);const c=cache[code];if(!c||c.exists!==r.exists||c.ut!==r.ut){cache[code]=r;emit(code)}}catch(e){}
    if(P_)P_.busy=false}
  function startPoll(code){if(polls[code])return;const P_={busy:false};polls[code]=P_;
    const tick=()=>{if(!polls[code])return;poll(code).finally(()=>{if(polls[code])P_.t=setTimeout(tick,document.hidden?4000:1200)})};tick()}
  function stopPoll(code){const P_=polls[code];if(P_){clearTimeout(P_.t);delete polls[code]}}
  document.addEventListener('visibilitychange',()=>{if(!document.hidden)Object.keys(polls).forEach(poll)});
  function roomDoc(code){return {
    get:async()=>{cache[code]=await fetchRoom(code);return snap(code)},
    set:async d=>{const r=await putRoom(code,d);if(!r.ok)throw {code:r.st===403?'denied':'unavailable'};cache[code]={exists:true,data:JSON.parse(JSON.stringify(d)),ut:r.ut};emit(code)},
    update:async d=>{for(let k=0;k<8;k++){const cur=await fetchRoom(code);if(!cur.exists)throw {code:'unavailable'};
        const next=deepMerge(cur.data||{},JSON.parse(JSON.stringify(d)));
        const r=await putRoom(code,next,'&currentDocument.updateTime='+encodeURIComponent(cur.ut));
        if(r.ok){cache[code]={exists:true,data:next,ut:r.ut};emit(code);return}
        if(r.st===403)throw {code:'denied'};await new Promise(z=>setTimeout(z,150+Math.random()*350))}
      throw {code:'unavailable'}},
    onSnapshot:fn=>{(subs[code]=subs[code]||[]).push(fn);if(cache[code])setTimeout(()=>fn(snap(code)),0);startPoll(code);
      return()=>{subs[code]=(subs[code]||[]).filter(f=>f!==fn);if(!subs[code].length)stopPoll(code)}}}}
  base.doc=p=>p.startsWith('salas/')?roomDoc(p.slice(6)):origDoc(p);
  // presença: cada um marca "estou aqui" e compara com a hora do servidor (sem problemas de relógios diferentes)
  let pres=null;
  base.presence=(code,who)=>{if(pres){clearInterval(pres.iv);pres=null}if(!code||who==null){base.onPeer&&base.onPeer(false);return}
    const me=`pres/${code}_${who}`,ot=`pres/${code}_${1-who}`;pres={};
    const beat=async()=>{try{const r=await fetch(url(me),{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({fields:{w:{integerValue:String(who)}}})});
        if(!r.ok)return;const mine=Date.parse((await r.json()).updateTime);
        const o=await fetch(url(ot),{cache:'no-store'});let on=false;if(o.ok){const t=Date.parse((await o.json()).updateTime);on=mine-t<25000}
        base.onPeer&&base.onPeer(on)}catch(e){}};
    beat();pres.iv=setInterval(beat,6000)};
  return base;
}

let rankUnsub=null;
function rankScore(i){const tr=aligned(i).slice(0,G.per),n=tr.length;const avg=tr.reduce((a,t)=>a+ev(t.i).nota,0)/n;return Math.round((avg+prizePts(i)*5/n)*100)/100}
async function saveRanking(){
  if(!db||!G||!G.seed||WHO==null)return;const key=G.seed+'-'+P(WHO);if(L.savedRank===key)return;L.savedRank=key;
  try{const tr=aligned(WHO).slice(0,G.per),sc=rankScore(WHO);
    await db.doc('albuns/'+key).set({score:sc,album:alb(WHO),player:NAMES[WHO],vs:MODE==='cpu'?'computador':nm(1-WHO),won:winnerIdx()===WHO,
      combos:prizePts(WHO),per:G.per,tracks:tr.map(t=>t.i),pedido:pedido().n,at:new Date().toISOString()});
    const top=await db.collection('albuns').orderBy('score','desc').limit(300).get();
    const pos=top.docs.filter(d=>(d.data().per||5)===G.per).slice(0,10).findIndex(d=>d.id===key);if(pos>=0)setTimeout(()=>toast(`🏆 “${alb(WHO)}” entrou no top 10 de ${G.per} músicas — ${pos+1}.º lugar!`),2600);
  }catch(e){}
}
function winnerIdx(){const sc=score();if(sc[0]!==sc[1])return sc[0]>sc[1]?0:1;return coinWinner()}
function openRanking(){L.screen='ranking';L.rank=null;L.rankErr='';render();
  if(!db){L.rankErr='O ranking precisa de sessão iniciada no Claude.';render();return}
  rankUnsub?.();const t=setTimeout(()=>{if(!L.rank){L.rankErr='O ranking está a demorar a carregar…';render()}},10000);
  rankUnsub=db.collection('albuns').orderBy('score','desc').limit(300).onSnapshot(q=>{clearTimeout(t);L.rank=q.docs.map(d=>({id:d.id,...d.data()}));L.rankErr='';if(L.screen==='ranking')render()},e=>{clearTimeout(t);L.rankErr='Não consegui abrir o ranking.';render()})}
function closeRanking(){rankUnsub?.();rankUnsub=null;L.screen=null;render()}

function duelLabel(d){return d>=G.per?'faixa bónus':`duelo ${d+1} / ${G.per}`}
function scoreboard(sc,lbl){return `<div class="score"><div class="s"><div class="num c0" data-count="${sc[0]}" data-delay="700">${fmt(sc[0])}</div><div class="lbl">${ico(0)}${esc(nm(0))}</div></div><div class="dash">${lbl||'vs'}</div><div class="s"><div class="num c1" data-count="${sc[1]}" data-delay="700">${fmt(sc[1])}</div><div class="lbl">${ico(1)}${esc(nm(1))}</div></div></div>`}
function partial(d){const s=[0,0];for(let k=0;k<=d;k++){const j=judge(k);if(j.w===-1){s[0]+=1;s[1]+=1}else s[j.w]+=2}return s}
const PICK_MS=30000,ORDER_BY={5:50000,8:75000,10:105000},orderMs=()=>ORDER_BY[G&&G.per]||75000,STAGE_MS={duel:5000,combos:10000,suspense:4000};
function stage(){return G.reveal||0}
function mainTie(){const d=partial(G.per-1);return d[0]+prizePts(0)===d[1]+prizePts(1)}
function stageKind(){const s=stage(),n=G.per;
  if(s<n)return ['duel',s];if(s===n)return ['combos'];
  if(mainTie()){if(s===n+1)return bonusDone()?['duel',n]:['bonus'];if(s===n+2)return ['suspense'];return ['result']}
  if(s===n+1)return ['suspense'];return ['result']}
function advance(){if(L.busy)return;const s=stage();L.lastAdv=s;W({reveal:s+1,revealAt:Date.now()})}
function stageBar(label){const [k]=stageKind(),dur=STAGE_MS[k];if(!dur)return '';
  return `<div class="stagebar">${timerBar((G.revealAt||Date.now())+dur,dur,label)}<button class="btn ghost sm" onclick="advance()">Avançar ⏭</button></div>
  ${MODE==='online'?`<p class="hint center" style="margin-top:6px">Vocês os dois veem este ecrã ao mesmo tempo — quem carregar em “Avançar” avança para os dois.</p>`:''}`}
function timerBar(deadline,total,label){const left=Math.max(0,(deadline-Date.now())/1000);
  return `<div class="timer ${left<=5?'low':''}" data-deadline="${deadline}" data-total="${total/1000}"><span class="tlab">${label||''}</span><div class="tbw"><div class="tb" style="width:${Math.min(100,left/(total/1000)*100)}%"></div></div><span class="tl">${Math.ceil(left)}s</span></div>`}
function duels(){const [k,d]=stageKind();
  if(k==='duel')return duelScreen(d);if(k==='combos')return prizesScreen();if(k==='bonus')return bonusScreen();if(k==='suspense')return suspense();

function bars(e){return `<div class="bars">${CRIT.map(([k,n])=>`<div class="bar"><span>${n}</span><i><b style="width:${e[k]*10}%"></b></i><em>${e[k]}</em></div>`).join('')}</div>`}

function duelScreen(d){
  const j=judge(d);
  const card=i=>{const s=i?j.B:j.A,t=i?j.b:j.a;return `<div class="pick ${j.w===i?'win':j.w===-1?'':'lose'} ${j.w===i&&i===WHO?'mine':''}"><div class="owner c${i}">${ico(i)}${esc(nm(i))}</div>${sleeve(s)}<div class="info"><div class="tt">${esc(s.t)}</div><div class="ta">${esc(s.a)}</div>
    <div class="nota" data-count="${t.sc}" data-dec="1" data-delay="${350+i*150}">${fmt1(t.sc)}</div>${bars(t.e)}<details class="whyd" open><summary>notas e detalhes</summary><div class="mbars">${bars(t.e)}</div><p class="why">${esc(t.e.why)}</p>${listen(s)}</details></div></div>`};
  const verdict=j.w===-1?'Empate':(j.w===WHO?'2 pontos para ti!':'2 pontos para '+(o_(j.w)));
  const isBonus=d>=G.per,run=isBonus?duelPts():partial(d);
  return `<div class="meta mono"><span>${duelLabel(d)}</span><span>a minha nota</span></div><div class="progress"><div style="width:${Math.min(1,(d+1)/G.per)*100}%"></div></div>

  <div class="verdict vline"><p>${esc(explain(j))}</p></div>
  <div class="pair reveal">${card(0)}<div class="ou">vs</div>${card(1)}</div>
  <div class="stagedock">${miniScore(run)}${stageBar(d+1>=G.per?(isBonus?'vencedor em':'combinações em'):'próximo duelo em')}</div>`;
}
function prizesScreen(){
  const col=i=>{const pr=prizes(i);return `<div class="panel pcard"><div class="phead"><div><h3 class="c${i}">${ico(i)}${esc(nm(i))}</h3><div class="hint" style="margin:0">${esc(alb(i))}</div></div></div>
    ${pr.map(x=>`<div class="prow ${x.p<0?'neg':''}"><div><b>${x.n}</b><span>${esc(x.w)}</span>${x.d?`<details><summary>ver ligações</summary><ul class="det">${x.d.map(l=>`<li>${esc(l)}</li>`).join('')}</ul></details>`:''}</div><em>${sg(x.p)}</em></div>`).join('')||'<p class="hint">Sem combinações desta vez.</p>'}</div>`};
  return `<div class="tot-head"><div class="mono" style="color:var(--muted)">2.ª parte</div><h2>Combinações</h2><div class="sub">O que cada um conseguiu ao montar o álbum. Os totais só aparecem no fim. 🤫</div></div>
  <div class="shelves" style="margin-top:0">${col(0)}${col(1)}</div><div class="stagedock">${stageBar(mainTie()?'desempate em':'resultado em')}</div>`;
}
function albumCover(i){
  const tr=aligned(i).slice(0,4);
  return `<div class="sleeve"><div class="disc"></div><div class="cover collage">${tr.map(cimg).join('')}<div class="sticker">${esc(alb(i))}<small>${esc(nm(i))} · ${aligned(i).length} faixas</small></div></div></div>`;
}
function sumRows(d,c,t,final){const lead=t[0]>t[1]?0:t[1]>t[0]?1:-1;
  const cell=(i,v,cls)=>`<div class="sc ${lead===i?'lead':''} ${cls||''}">${v}</div>`;
  return `<div class="sr head"><div></div><div class="sc c0">${ico(0)}${esc(nm(0))}</div><div class="sc c1">${ico(1)}${esc(nm(1))}</div></div>
  <div class="sr"><div class="sl">⚔️ Duelos</div>${cell(0,fmt(d[0]))}${cell(1,fmt(d[1]))}</div>
  <div class="sr"><div class="sl">🧩 Combinações</div>${cell(0,sg(c[0])||'0')}${cell(1,sg(c[1])||'0')}</div>
  <div class="sr tot"><div class="sl">Total</div>${cell(0,`<span data-count="${t[0]}" data-delay="500">${fmt(t[0])}</span>`,'big')}${cell(1,`<span data-count="${t[1]}" data-delay="500">${fmt(t[1])}</span>`,'big')}</div>`}
function result(byCoin){
  const sc=score();
  const w=byCoin?coinWinner():(sc[0]>sc[1]?0:1),n=G.per+(bonusDone()?1:0),dp=duelPts(),wins=[0,0];
  const rows=[];for(let d=0;d<n;d++){const j=judge(d);if(j.w>=0)wins[j.w]++;rows.push(`<tr><td class="mono">${d>=G.per?'B':d+1}</td><td class="${j.w===0?'w':''}">${esc(j.A.t)}<div class="a">${esc(j.A.a)}</div></td><td class="res"><b class="${j.w===0?'c0':''}">${fmt1(j.a.sc)}</b> – <b class="${j.w===1?'c1':''}">${fmt1(j.b.sc)}</b></td><td class="${j.w===1?'w':''}">${esc(j.B.t)}<div class="a">${esc(j.B.a)}</div></td></tr>`)}
  const head=w===WHO?'Ganhaste! 🎉':(isCpu(w)?'Ganhou o computador 🤖':(w===0?'Ganhou o Miguel':'Ganhou a Clara'));
  return `<div class="winner"><div class="mono" style="color:var(--muted)">resultado final${byCoin?' · empate total, decidiu a moeda 🪙':''}</div><h1 class="c${w} wtitle">${(()=>{let k=0;return head.split(' ').map(wd=>`<span class="wd">${[...wd].map(ch=>`<span style="animation-delay:${.3+(k++)*.04}s">${esc(ch)}</span>`).join('')}</span>`).join(' ')})()}</h1><div class="by">com <b>“${esc(alb(w))}”</b></div></div>
  <div class="wcover"><div class="coverwrap"><div class="crown">👑</div>${albumCover(w)}</div></div>
  <div class="sumtable panel final">${sumRows(dp,[prizePts(0),prizePts(1)],sc,true)}
   <div class="sr sub"><div class="sl">duelos ganhos</div><div class="sc">${wins[0]} de ${n}</div><div class="sc">${wins[1]} de ${n}</div></div></div>
  <div class="actions"><button class="btn" ${L.busy?'disabled':''} onclick="rematch()">🔁 Revanche <span class="rmx">· ${G.per} músicas${MODE==='cpu'?' · '+({facil:'Fácil',normal:'Normal',dificil:'Difícil'}[G.level||'normal']):''}</span></button><button class="btn ghost" ${L.busy?'disabled':''} onclick="otherMode()">🎛️ Jogar noutro modo</button><button class="btn ghost" onclick="toMenu();scrollTo(0,0)">🏠 Menu principal</button><button class="btn ghost" onclick="openRanking()">🏆 Top 10</button><button class="btn ghost" onclick="copyRes(${w})">📋 Copiar resultado</button></div>
  <div class="panel mt myrank"><span class="mono">pontuação do teu álbum para o ranking</span><b>${fmt(rankScore(WHO))}</b></div>
  <details class="panel more mt"><summary>Ver os duelos e os dois álbuns</summary>
   <table class="duels"><thead><tr><th class="mono">#</th><th class="c0">${esc(nm(0))}</th><th class="mono" style="text-align:center">notas</th><th class="c1">${esc(nm(1))}</th></tr></thead><tbody>${rows.join('')}</tbody></table>
   <div class="covers mt">${[0,1].map(i=>`<div class="coverwrap small ${i===w?'':'lose'}">${albumCover(i)}<div class="cap">${esc(nm(i))}</div></div>`).join('')}</div>
  </details>
  ${L.copyText?`<textarea class="copy" readonly onclick="this.select()">${esc(L.copyText)}</textarea>`:''}`;
}
function body(){
  if(WHO==null)return whoScreen();
  if(L.screen==='ranking')return rankingScreen();
  if(!MODE)return modeScreen();
  if(MODE==='cpu'){if(!G||!G.seed)return newScreen();return ({draft,order,duels})[phase()]()}
  if(L.status==='boot')return `<div class="panel wait"><div class="minirecord"></div><div class="big">A pôr o disco…</div></div>`;
  if(L.status==='nodb')return `<div class="panel wait"><div class="big">Sem ligação ao jogo</div><p>Abre esta página com sessão iniciada no Claude. A Clara precisa que o Miguel lhe partilhe a página como <b>Editor</b> (ou usem a versão web do jogo).</p></div>`;
  if(!CODE)return roomScreen();
  if(L.status==='loading')return `<div class="panel wait"><div class="minirecord"></div><div class="big">A entrar na sala ${esc(CODE)}…</div></div>`;
  if(L.status==='slow')return `<div class="panel wait"><div class="minirecord"></div><div class="big">Ainda a ligar…</div><p>A sala está a demorar a responder. Verifica a ligação — a página continua a tentar.</p></div>`;
  if(L.status==='error')return `<div class="panel wait"><div class="big">Ups</div><p>${esc(L.err)}</p><div class="mt"><button class="btn" onclick="leaveRoom();leaveRoom()">Voltar</button></div></div>`;
  if(L.status==='gone'||!G)return `<div class="panel wait"><div class="big">${db&&db.p2p?'Não consegui ligar à sala':'Esta sala já não existe'}</div>${db&&db.p2p?'<p>Quem criou a sala tem de ter o jogo aberto no telemóvel ou no computador.</p>':''}<div class="mt"><button class="btn" onclick="leaveRoom();leaveRoom()">Voltar</button></div></div>`;
  if(!(G.joined?.p0&&G.joined?.p1))return lobby();
  if(!G.seed)return newScreen();
  return ({draft,order,duels})[phase()]();
}
function viewKey(){if(L.screen)return 'scr:'+L.screen+(L.rank?'1':'0')+(L.rankPer||'all');if(!G||!G.seed||!MODE)return [WHO,MODE,CODE,L.status,G?.joined?.p0,G?.joined?.p1,G?.seed].join('|');const ph=phase();return [MODE,G.round,ph,ph==='draft'?picks().length:'',ph==='duels'?stageKind().join(':'):'',ph==='order'?!!G.orders?.[P(WHO)]:''].join('|')}
function render(){
  const app=document.getElementById('app'),keep={};app.querySelectorAll('input[id]').forEach(i=>keep[i.id]=i.value);
  const fid=document.activeElement&&document.activeElement.id;
  const key=viewKey(),enter=key!==L.lastKey;L.lastKey=key;
  app.innerHTML=header()+`<main class="view ${enter?'enter':''}">${body()}</main>`+dock()+draftDock()+reactBar();try{rxCheck()}catch(e){}
  document.body.classList.toggle('has-dock',!!document.querySelector('.odock'));document.body.classList.toggle('has-ddock',!!document.querySelector('.ddock'));{const sd=app.querySelector('main .stagedock');if(sd)app.appendChild(sd)}document.body.classList.toggle('has-sdock',!!document.querySelector('.stagedock'));
  try{boardMount()}catch(e){}
  for(const k in keep){const el=document.getElementById(k);if(el)el.value=keep[k]}
  if(fid)document.getElementById(fid)?.focus();
  const pk=(G&&G.seed&&MODE)?(phase()==='duels'?'duels:'+(stageKind()[0]==='duel'&&stageKind()[1]<G.per?'duel':stageKind()[0]):phase()):'';
  if(pk!==L.lastPhase){const prevP=L.lastPhase;L.lastPhase=pk;if(prevP!==undefined&&pk){const T={draft:['Isto ou aquilo!','escolham as vossas músicas'],order:['Hora de ordenar','monta o teu álbum'],'duels:duel':['Duelos!','faixa contra faixa'],'duels:combos':['Combinações','como montaram os álbuns'],'duels:suspense':['E agora…','o grande final']}[pk];if(T)intertitle(T[0],T[1])}}
  sambaLetters();
  if(enter){window.scrollTo({top:0,behavior:'smooth'});countUps();setTimeout(fitDraft,450);
    if(document.querySelector('.view .winner')){celebrate(120);saveRanking()}
    else if(document.querySelector('.view .pick.win.mine'))celebrate(24);}
}
function intertitle(t,sub){return;if(FX.ok){document.querySelectorAll('.inter').forEach(e=>e.remove());fxSunflower(t,sub);return}if(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches)return;
  document.querySelectorAll('.inter').forEach(e=>e.remove());const d=document.createElement('div');d.className='inter';
  d.innerHTML=`<div class="iflower">${sunflower()}</div><div class="it"><b>${esc(t)}</b><small>${esc(sub)}</small></div>`;
  document.body.appendChild(d);setTimeout(()=>d.remove(),2000)}
const BIGW={draft:'ISTO OU AQUILO',order:'ÁLBUM','duels:duel':'DUELO','duels:combos':'COMBOS','duels:bonus':'BÓNUS','duels:suspense':'FINAL'};
function sambaLetters(){document.querySelectorAll('.view .tot-head h2').forEach(h=>{if(h.dataset.k)return;h.dataset.k=1;const t=h.textContent;const m=t.match(/^(.*?)(\s\S+)$/);if(m)h.innerHTML=`${esc(m[1])} <em>${esc(m[2].trim())}</em>`});return;const w=L.screen==='ranking'?'TOP 10':BIGW[L.lastPhase];document.querySelectorAll('.view .tot-head').forEach(h=>{if(w&&!h.querySelector('.bigword'))h.insertAdjacentHTML('afterbegin',`<div class="bigword" aria-hidden="true">${esc(w)}</div>`)});return;document.querySelectorAll('.view .tot-head h2,.view .suspense h2').forEach(h=>{if(h.children.length)return;const t=h.textContent;h.innerHTML=[...t].map((c,k)=>`<span class="sl" style="animation-delay:${.15+k*.035}s">${c===' '?'&nbsp;':esc(c)}</span>`).join('')})}
function fitDraft(){try{const d=document.querySelector('.ddock');const btn=[...document.querySelectorAll('.pair .pick .btn')];if(!d||!btn.length)return;const lim=d.getBoundingClientRect().top-10,bot=Math.max(...btn.map(b=>b.getBoundingClientRect().bottom));if(bot>lim)window.scrollBy({top:bot-lim})}catch(e){}}
function countUps(){
  document.querySelectorAll('[data-count]').forEach(el=>{const v=parseFloat(el.dataset.count),dec=el.dataset.dec==='1',t0=performance.now(),dur=900+Math.random()*300,delay=parseFloat(el.dataset.delay||'250');
    el.textContent=dec?'0':'0';
    const step=t=>{const k=Math.min(1,Math.max(0,(t-t0-delay)/dur)),e=1-Math.pow(1-k,3),x=v*e;el.textContent=dec?fmt1(k<1?Math.round(x*10)/10:v):fmt(k<1?Math.round(x*4)/4:v);if(k<1)requestAnimationFrame(step)};
    requestAnimationFrame(step)});
}
function celebrate(n){if(FX.ok){fxConfetti(Math.min(160,n+20));return}
  if(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches)return;
  const box=document.createElement('div');box.className='confetti';document.body.appendChild(box);
  const cols=['#FFD700','#009C3B','#1338BE','#FFD700','#009C3B','#F7F7F7'];let h='';
  for(let k=0;k<n;k++){const x=Math.random()*100,dl=Math.random()*.9,du=2.6+Math.random()*2.2,sz=8+Math.random()*16,r=Math.random();
    const inner=r<.18?sunflower():r<.38?heart():`<i style="background:${cols[k%cols.length]}"></i>`;
    h+=`<span style="left:${x}%;width:${sz}px;height:${sz}px;animation-delay:${dl}s;animation-duration:${du}s;--sway:${(Math.random()*120-60).toFixed(0)}px;--rot:${(Math.random()*900-450).toFixed(0)}deg">${inner}</span>`}
  box.innerHTML=h;setTimeout(()=>box.remove(),6500);
}

/* ======== fundo: capas, girassóis e corações ======== */
function sunflower(){let p='';for(let k=0;k<16;k++)p+=`<ellipse cx="50" cy="20" rx="8" ry="20" fill="${k%2?'#ffc93c':'#f5a623'}" transform="rotate(${k*22.5} 50 50)"/>`;
  let d='';for(let k=0;k<18;k++){const a=k*2.4,r=3+k*.9;d+=`<circle cx="${50+r*Math.cos(a)}" cy="${50+r*Math.sin(a)}" r="1.6" fill="#2a160a" opacity=".7"/>`}
  return `<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">${p}<circle cx="50" cy="50" r="19" fill="#6b3a17"/><circle cx="50" cy="50" r="15" fill="#4a2810"/>${d}</svg>`}
function heart(){return `<svg viewBox="0 0 100 92" xmlns="http://www.w3.org/2000/svg"><path d="M50 88 C 18 64 2 46 2 27 C 2 12 14 2 28 2 C 38 2 46 8 50 17 C 54 8 62 2 72 2 C 86 2 98 12 98 27 C 98 46 82 64 50 88Z" fill="#ffd23f"/><path d="M22 18 q8 -6 16 0" stroke="#fff3b0" stroke-width="5" fill="none" stroke-linecap="round" opacity=".7"/></svg>`}
function buildBg(){
  const wall=document.getElementById('bgwall');if(!wall)return;
  const n=Math.max(4,Math.min(10,Math.ceil(window.innerWidth/140)));
  const r=rng(hash('fundo'+n));const idx=SONGS.map((_,i)=>i).filter(i=>!EXCL.has(i)&&SONGS[i][2]);
  let html='';
  for(let c=0;c<n;c++){
    const pick=[];for(let k=0;k<9;k++)pick.push(idx[Math.floor(r()*idx.length)]);
    const imgs=pick.map(i=>`<img src="${SONGS[i][2]}" alt="" loading="lazy">`).join('');
    html+=`<div class="col ${c%2?'down':''}" style="--dur:${70+Math.floor(r()*50)}s">${imgs}${imgs}</div>`;
  }
  wall.innerHTML=html;
  document.querySelectorAll('.tinyflower').forEach(e=>e.innerHTML=sunflower());
}
let _bgW=0;window.addEventListener('resize',()=>{const n=Math.ceil(window.innerWidth/140);if(n!==_bgW){_bgW=n;buildBg()}});

/* ======== arranque ======== */
buildBg();
{const w=lsGet().who;WHO=(w===0||w===1)?w:null}
/* abrir o site de novo começa sempre no menu principal (mantém quem és);
   só um recarregar acidental a meio do jogo (menos de 2 min) continua onde estava */
{const ls=lsGet();if(!(ls.alive&&Date.now()-ls.alive<120000))lsSet({mode:null,code:null,cpuGame:null})}
const _alive=()=>{if(!document.hidden)lsSet({alive:Date.now()})};_alive();setInterval(_alive,15000);
addEventListener('pagehide',()=>lsSet({alive:Date.now()}));document.addEventListener('visibilitychange',()=>{if(document.hidden)lsSet({alive:Date.now()})});
render();
try{fxInit()}catch(e){}
(async()=>{
  const c=window.claude;
  if(!c||!c.use){
    db=makeCloudDb();db.onPeer=v=>{if(L.peerOnline!==v){L.peerOnline=v;const h=document.getElementById('hdr');if(h)h.outerHTML=header()}}
    const m=lsGet().mode;if(m==='cpu'||m==='online')setMode(m);else{L.status='ok';render()}return}
  try{db=await c.use('db')}catch(e){db=null}
  if(!db){db=null}
  try{room=await c.use('room')}catch(e){room=null}
  const m=lsGet().mode;if(m==='online'||m==='cpu')setMode(m);else{L.status='ok';render()}
})();
</script>
